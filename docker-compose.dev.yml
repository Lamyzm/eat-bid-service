services:
  postgres:
    image: postgres:16-alpine
    container_name: eatbid-pg
    environment:
      POSTGRES_USER: eatbid
      POSTGRES_PASSWORD: eatbid
      POSTGRES_DB: eatbid
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eatbid"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
