# 릴리스 이미지 Trivy 게이트의 예외 목록이다(EAT-374).
# 항목은 고칠 판이 아직 없고 런타임이 그 코드를 싣지 않는다는 것을 확인한 취약점만, 하나씩 만료일을 달아 둔다.
# 만료가 지나면 Trivy가 다시 막으므로 그때 기반 이미지 digest를 올리거나 다시 판단한다.
# 규칙과 기록은 docs/architecture/stack/delivery-and-operations.md가 소유하고,
# infra/tests/test_build_contract.py가 만료일·이유 누락과 31일을 넘는 만료를 막는다.
vulnerabilities:
  - id: CVE-2026-76844
    statement: >-
      distroless nodejs24-debian13의 시스템 zlib1g 1:1.3.dfsg+really1.3.1-1+b1. Debian trixie에 고친 판이 없고
      (sid 1:1.3.dfsg+really1.3.2-4만 수정, Debian bug 1153063) 최신 digest도 같은 판이다. Node 바이너리는
      libz.so를 링크하지 않고 내장 zlib 1.3.2.1을 쓰며, 우리 런타임은 취약한 gz* 파일 쓰기 API를 부르지 않는다.
    expired_at: 2026-11-19
