[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eatbid"
version = "0.1.0"
description = "eatbid data-plane pipeline"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
eatbid = "eatbid.cli:main"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.76.0",
    "hypothesis>=6,<7",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
    "testcontainers[postgres]>=4,<5",
]

[tool.pytest.ini_options]
markers = ["lake: 로컬 원본 레이크가 있을 때만 도는 테스트"]
# 기본 스위트는 이 PC의 로컬 원본 레이크에 의존하지 않는다. 레이크 대조는 `-m lake`로 명시해 돌리며
# 명령줄의 `-m`이 뒤에 와서 이 기본값을 이긴다.
addopts = ["-m", "not lake"]

[tool.ruff.lint.isort]
known-first-party = ["eatbid", "fakes"]
