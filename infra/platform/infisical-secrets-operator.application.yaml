apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts
    chart: secrets-operator
    targetRevision: 0.11.8
    helm:
      valuesObject:
        # Operator는 eatbid namespace 밖의 Secret을 만들거나 읽지 않는다. 비밀값 SSOT는 Infisical이고
        # 클러스터는 그 사본을 받는 소비자일 뿐이므로 권한을 그 경계로 좁힌다.
        scopedNamespace: eatbid
        scopedRBAC: true
  destination:
    server: https://kubernetes.default.svc
    namespace: eatbid
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
