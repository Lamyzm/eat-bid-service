# 파드 stdout을 OpenObserve로 보내는 수집기. DaemonSet 하나가 노드의 /var/log/containers를 tail한다.
# OpenObserve가 권하는 otel-collector chart는 cert-manager와 OpenTelemetry operator를 전제하는데,
# 한 노드에 그 둘을 세우는 것은 로그 한 줄을 옮기는 데 비해 지나치다. fluent-bit은 30MiB 안팎이다.
#
# eatbid namespace만 보낸다. 시스템 파드 로그는 지금 물을 질문이 없고, 보내면 R2와 검색만 비싸진다.
# 서버는 이미 JSON 한 줄씩 쓰므로(Merge_Log) 파싱 규칙이 따로 없다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.58.2
    helm:
      valuesObject:
        kind: DaemonSet
        # OpenObserve 루트 사용자로 인증한다. 별도 ingest 토큰을 만들면 관리할 비밀이 하나 더 생기고,
        # 이 자격이 새도 할 수 있는 일은 이 클러스터 안의 저장소에 로그를 쓰는 것뿐이다.
        env:
          - name: O2_USER
            valueFrom: { secretKeyRef: { name: eatbid-observability, key: ZO_ROOT_USER_EMAIL } }
          - name: O2_PASSWORD
            valueFrom: { secretKeyRef: { name: eatbid-observability, key: ZO_ROOT_USER_PASSWORD } }
        resources:
          requests: { cpu: 20m, memory: 32Mi }
          limits: { memory: 128Mi }
        config:
          inputs: |
            [INPUT]
                Name tail
                Path /var/log/containers/*_eatbid_*.log
                multiline.parser docker, cri
                Tag kube.*
                Mem_Buf_Limit 5MB
                Skip_Long_Lines On
                Refresh_Interval 10
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Keep_Log Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On
                Labels Off
                Annotations Off
          outputs: |
            [OUTPUT]
                Name http
                Match kube.*
                Host openobserve
                Port 5080
                URI /api/default/k8s/_json
                Format json
                Json_date_key _timestamp
                Json_date_format iso8601
                HTTP_User ${O2_USER}
                HTTP_Passwd ${O2_PASSWORD}
                compress gzip
                Retry_Limit 5
  destination:
    server: https://kubernetes.default.svc
    namespace: eatbid
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
