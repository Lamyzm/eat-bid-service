apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app.yaml
  - poll.yaml
  - tunnel.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: db-schema
    namespace: eatbid
    files: [schema.sql]
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    newTag: f7da8cb
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    newTag: f7da8cb
