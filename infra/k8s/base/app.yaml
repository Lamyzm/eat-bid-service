apiVersion: v1
kind: Namespace
metadata:
  name: eatbid
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: eatbid
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eatbid
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: eatbid }
            - { name: POSTGRES_PASSWORD, value: eatbid }
            - { name: POSTGRES_DB, value: eatbid }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "eatbid"] }
            periodSeconds: 3
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: pgdata }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: eatbid
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: eatbid
spec:
  replicas: 1
  selector: { matchLabels: { app: server } }
  template:
    metadata: { labels: { app: server } }
    spec:
      containers:
        - name: server
          image: eatbid-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, value: "postgres://eatbid:eatbid@postgres:5432/eatbid" }
            # 공유 토큰 서명 키 — placeholder: 리더가 실값 주입 (k8s Secret 권장)
            - name: EATBID_SHARE_SECRET
              valueFrom:
                secretKeyRef: { name: eatbid-share, key: EATBID_SHARE_SECRET }
            # Better Auth — Secret eatbid-auth 에 리더가 실값 주입
            # kubectl -n eatbid create secret generic eatbid-auth             #   --from-literal=BETTER_AUTH_SECRET=... --from-literal=GOOGLE_CLIENT_ID=...             #   --from-literal=GOOGLE_CLIENT_SECRET=...
            # ⚠ optional: true 를 뗐다. 그게 조용한 실패였다 —
            #   Secret 이 없으면 파드가 **정상적으로 뜨고 인증만 조용히 망가진다.**
            #   `?? 기본값`·`|| true` 와 같은 모양이다. 특히 새 기계 부트스트랩에서
            #   Secret 주입을 빠뜨려도 클러스터가 초록으로 통과하고, 사장이 로그인할
            #   때 처음 드러난다. 뗀 지금은 CreateContainerConfigError 로 시끄럽게 멈춘다.
            #
            #   뗄 수 있는 근거(2026-08-28 실측): 세 키가 eatbid-auth 에 실재하고
            #   도는 파드가 셋 다 채워서 갖고 있다. 인증 미구현 기간은 끝났다.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: eatbid-auth, key: BETTER_AUTH_SECRET }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: eatbid-auth, key: GOOGLE_CLIENT_ID }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: eatbid-auth, key: GOOGLE_CLIENT_SECRET }
            - { name: BETTER_AUTH_URL, value: "http://localhost:8081" }
          ports: [{ containerPort: 4400 }]
          readinessProbe:
            httpGet: { path: /api/healthz, port: 4400 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: eatbid
spec:
  selector: { app: server }
  ports: [{ port: 80, targetPort: 4400 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eatbid
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: eatbid-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_URL, value: "http://server" }
          ports: [{ containerPort: 3000 }]
          # 스타터 데모 라우트(/dashboard/overview)를 가리키고 있었다. 그 라우트를 지우면
          # 파드가 영영 Ready 가 안 되는데 원인이 커밋 diff 에 안 보인다 — 잔재 삭제의 전제.
          readinessProbe:
            httpGet: { path: /dashboard/today, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eatbid
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server
  namespace: eatbid
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: server, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
---
# 스키마 적용 전용 Job — 매 sync 앞에서 돈다.
#
# ⚠ 이게 없던 동안 schema.sql 에 쌓인 ALTER 가 이미 도는 클러스터에 **한 번도
#   적용되지 않았다.** initial-load Job 은 한 번 돌고 끝이고 spec.template 이
#   immutable 이라, 명령을 고치면 sync 가 `field is immutable` 로 실패했다.
#   그래서 로더가 새 컬럼에 insert 하면 `column does not exist` 로 7개 테이블이
#   통째로 비게 된다 — 크론이라 무인이다. 지금까지 안 터진 건 누가 손으로 psql 을
#   돌렸기 때문이고 그 기록이 리포에 없다. 스키마 적용이 사람 기억에 의존했다.
#
#   적재(load_postgres.py)는 여기 넣지 않는다. 매 sync 마다 전량 재적재가 돌면
#   비용도 크고, 그 스크립트는 delete 로 시작한다. 스키마만 적용한다.
#   schema.sql 은 전부 IF NOT EXISTS 라 반복 실행이 안전하다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: eatbid
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          command: ["sh","-c","until pg_isready -h postgres -U eatbid; do sleep 2; done; psql -v ON_ERROR_STOP=1 postgres://eatbid:eatbid@postgres:5432/eatbid -f /schema/schema.sql"]
          volumeMounts: [{ name: schema, mountPath: /schema }]
      volumes:
        - { name: schema, configMap: { name: db-schema } }
---
# 초기 적재 Job 은 제거했다.
#
# ⚠ Job 의 spec.template 은 immutable 이다. 이 Job 이 리포에 남아 있으면, 명령을
#   한 글자만 고쳐도 ArgoCD sync 가 `field is immutable` 로 **영구히 실패**한다.
#   실제로 그렇게 막혀 있었고, 그래서 스키마 변경이 클러스터에 안 닿았다.
#   역할은 이미 나뉘었다 — 스키마는 db-migrate(PreSync), 적재는 daily-refresh 다.
#
#   새 클러스터를 세울 때만 수동으로 한 번 돌린다:
#     kubectl -n eatbid create job initial-load --image=eatbid-dataplane:dev -- \
#       python tools/serve/load_postgres.py
#   (레이크 hostPath 와 DATABASE_URL 을 붙여야 하므로, 실제로는 daily-refresh 를
#    수동 트리거하는 편이 낫다: kubectl -n eatbid create job --from=cronjob/daily-refresh boot)
---
# 매일 아침 유기 사이클: 열린공고 수집 → 적재
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-refresh
  namespace: eatbid
spec:
  schedule: "0 22 * * *"   # UTC 22:00 = KST 07:00
  # Forbid 는 맞다. Allow 면 로더 둘이 동시에 firm_bids(790만 행)를 지워 락이 엉키고,
  # Replace 면 느린 날 영원히 못 끝낸다. 문제는 정책이 아니라 데드라인이 없던 것이었다 —
  # 주기가 24시간인데 상한이 없으면 매달린 Job 이 다음 회차를 조용히 스킵시킨다.
  # 데드라인을 주기보다 훨씬 짧게 두면 스킵 조건 자체가 사라진다.
  # 3시간 = 현실 추정 15분의 12배 여유이자 주기의 1/8. 넘으면 지연이 아니라 매달린 것이다.
  # 로더는 commit 이 한 곳뿐이라 킬되면 전량 롤백되고 어제 데이터가 남는다.
  concurrencyPolicy: Forbid
  # 실패 흔적이 1개만 남아 다음 실패에 덮이고 있었다.
  failedJobsHistoryLimit: 5
  # 미설정이면 스케줄 100회를 놓쳤을 때 CronJob 이 스케줄링을 아예 멈춘다.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # activeDeadlineSeconds 는 JobSpec 필드다. CronJob 의 spec 바로 아래 두면
      # 조용히 무시된다 — 처음에 거기 넣었다가 라이브에서 빈 값으로 확인해 옮겼다.
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: eatbid-dataplane:dev
              imagePullPolicy: IfNotPresent
              # 매일: 전국 증분 크롤(개찰분) → 전국 열린공고 수집 → 재적재
              # 앞 단계가 실패하면 뒤를 돌리지 않는다. 예전에는 `;` 로 이어져 있어
              # 레이크 갱신이 실패해도 로더가 낡은 레이크로 7개 테이블을 재구축했다.
              command: ["sh", "-c", "set -e; python tools/bidboard/update_lake.py && python tools/bidboard/fetch_open.py && python tools/serve/load_postgres.py"]
              env:
                - { name: EATBID_HOME, value: /app }
                - { name: EATBID_DATA_ROOT, value: /lake }
                # 하루 한 번 전량 재조회 — 마감 시각 변경(변경공고 1.1%)을 여기서 흡수한다.
                # 폴링은 증분이라 아는 공고의 상세를 건너뛰어 그 변경을 못 본다.
                - { name: EATBID_OPEN_FULL, value: "1" }
                - { name: DATABASE_URL, value: "postgres://eatbid:eatbid@postgres:5432/eatbid" }
              volumeMounts: [{ name: lake, mountPath: /lake }]
          volumes:
            - name: lake
              hostPath: { path: /lake, type: Directory }
