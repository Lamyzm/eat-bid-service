# GHCR 은 프라이빗이라 이미지를 당기려면 자격증명이 필요하다.
#
# 왜 파드마다 imagePullSecrets 를 안 박나
# ─────────────────────────────────────
# 그러면 워크로드마다 한 곳씩이다 — server·web·dataplane workflow pod. 새 워크로드를 추가할
# 때마다 한 곳을 빠뜨리면 그 파드만 ImagePullBackOff 가 난다. 같은 값을 여러 곳에
# 적는 것이 우리가 반복한 사고의 모양이다(시도 코드가 네 곳이었다).
#
# 네임스페이스의 default ServiceAccount 에 한 번 붙이면 그 SA 를 쓰는 모든 파드가
# 자동으로 받는다. **한 곳이다.**
#
# 다행히 이 실패는 시끄럽다 — 자격증명이 없으면 ImagePullBackOff 로 멈춘다.
# 조용히 옛 이미지가 도는 쪽이 아니다.
#
# Secret 은 git 에 없다. bootstrap 이 만든다(ARCH-DELIVERY §6):
#   kubectl -n eatbid create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=<github-user> \
#     --docker-password=<PAT: read:packages>
#
# ⚠ ArgoCD 가 prune: true 라 이 파일을 리포에서 지우면 default SA 를 지우려 든다.
#   지우지 말고 imagePullSecrets 만 비워라.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: eatbid
imagePullSecrets:
  - name: ghcr-pull
