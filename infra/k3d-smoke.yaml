# smoke 전용 k3d 클러스터. `pnpm workflow:argo-smoke`가 만들고 끝나면 지운다(EAT-226, 관측 계획 2단계).
#
# 운영 기록 파일 infra/k3d.yaml을 쓰지 않는 이유는 그 머리말이 "지금 도는 클러스터에 적용하지 마라"이고,
# 거기에는 이 기계에서만 뜻이 있는 값(/lake 마운트, 8081 포트, 5822 API 포트)이 있기 때문이다. smoke는
# 그 어느 것도 필요 없다 — 진짜 Argo가 진짜 WorkflowTemplate을 받아 DAG를 시작하는지만 본다.
#
# k3s 버전은 운영 기록과 같은 값을 박는다. 여기서 검증한 것이 거기서 검증한 것이어야 한다.
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: eatbid-smoke

servers: 1
agents: 0

image: docker.io/rancher/k3s:v1.35.5-k3s1

# API 포트를 고정하지 않는다. 이 클러스터는 한 실행 동안만 살고, 스크립트는 kubeconfig 항목은 받되
# 현재 context는 바꾸지 않고(--kubeconfig-switch-context=false) 모든 호출에 --context를 명시한다.
# 포트를 고정하면 두 smoke가 겹칠 때 서로를 막는다.
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"

# 포트 매핑도 볼륨도 없다. 웹·터널은 smoke가 지우고, DB는 파드 안의 빈 디스크로 충분하다.
options:
  k3d:
    wait: true
    timeout: "120s"
  k3s:
    extraArgs:
      # Traefik은 smoke가 쓰지 않는다. 안 띄우면 30초쯤 빨리 뜬다.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # metrics-server는 aggregated API(metrics.k8s.io)를 등록하고, 그 API가 아직 안 뜬 사이에 helm이
      # discovery를 하면 "the server is currently unable to handle the request"로 죽는다(2026-09-16
      # PR #34 CI 실측). smoke는 metrics를 쓰지 않으므로 aggregated API 자체를 없앤다.
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
