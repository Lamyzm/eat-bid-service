# 환경이 공유하는 전부다. 여기에는 환경마다 달라지는 값이 하나도 없어야 한다 — image digest, hostname,
# CronWorkflow의 suspend, Infisical env slug, 자원 요청은 전부 overlay가 소유한다(ADR 0051 결정 1).
#
# 이 파일만으로는 배포할 수 없다. image가 이름뿐이라 overlay가 digest를 채우기 전에는 pull할 곳이 없다.
# 그것이 의도다 — base를 그대로 클러스터에 올릴 수 있으면 환경 없이 배포하는 길이 생긴다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - app.yaml
  - tunnel.yaml
  - serviceaccount.yaml
  - migration.yaml
  - db-provisioning.yaml
  - secrets.yaml
  - internal-ingress.yaml
  - observability-ingress.yaml
  - workflows

# SQL을 ConfigMap에 손으로 옮겨 적으면 저장소와 클러스터의 권한 집합이 갈라진다. generator가 파일을
# 그대로 실어 이름 접미사 해시로 내용까지 고정하므로, SQL이 바뀌면 hook Job의 pod spec도 함께 바뀐다.
configMapGenerator:
  - name: eatbid-db-provisioning
    namespace: eatbid
    files:
      - db-provisioning.sql
  # Grafana chart가 이름으로 마운트하므로(platform/grafana.application.yaml의 dashboardsConfigMaps)
  # 이 ConfigMap만은 hash 접미사 없이 이름을 고정한다. 대시보드 JSON이 바뀌면 Grafana가 파일을 다시 읽는다.
  - name: eatbid-grafana-dashboards
    namespace: eatbid
    options:
      disableNameSuffixHash: true
    files:
      - observability/monitoring-round.json
      - observability/ops-summary.json
      - observability/crawler-progress.json
