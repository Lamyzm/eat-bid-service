  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/dataplane
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-database-dataplane
    secretNamespace: eatbid
    creationPolicy: Orphan
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-r2
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/dataplane/r2
      credentialsRef:
