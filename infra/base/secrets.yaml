# 비밀값의 진실 원천은 Infisical이다. 이 파일은 "어느 경로의 값을 어느 이름으로 클러스터에 두는가"만
# 선언하며 값 자체는 담지 않는다. operator가 Infisical에서 당겨와 Secret을 만들고 회전 시 갱신한다.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-database-migrator
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/migrator
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-database-migrator
    secretNamespace: eatbid
    creationPolicy: Orphan
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-database-api
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/server
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-database-api
    secretNamespace: eatbid
    creationPolicy: Orphan
---
# dataplane은 DATABASE_URL과 R2 자격증명을 같은 경로에서 함께 읽는다. 수집 workload 하나가 둘 다 쓴다.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
