---
# postgres bootstrap 값은 이미 초기화된 pgdata 볼륨의 superuser 계정과 정확히 같아야 한다.
# 다르면 컨테이너는 기동하지만 readinessProbe의 pg_isready가 없는 role/DB를 찾아 영원히 실패한다.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-postgres-bootstrap
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/postgres
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-postgres-bootstrap
    secretNamespace: eatbid
    creationPolicy: Orphan
---
# web 읽기 캐시 무효화 토큰이다. 같은 값이 Infisical `/runtime/web`과 `/runtime/dataplane` 두 경로에
# 있어야 하고(부르는 쪽은 dataplane, 받는 쪽은 web) `/runtime/dataplane` 쪽은 이미 있는
# `eatbid-database-dataplane`이 같은 경로를 통째로 당겨 오므로 새 InfisicalSecret은 web 쪽 하나다.
# 회전은 두 경로의 값을 함께 바꾼다. 토큰이 유출돼도 할 수 있는 일은 캐시를 비우는 것뿐이다.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-cache-revalidate
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/web
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-cache-revalidate
    secretNamespace: eatbid
    creationPolicy: Orphan
---
# 감시가 위반을 사람에게 보내는 경로다. 봇 토큰은 환경 사이에 공유하고 대상 방만 환경별로 다르다.
# 봇을 둘로 나누면 토큰이 둘이 되고 회전을 두 번 해야 한다. 방을 나누는 이유는 dev의 잦은 배포 잡음이
# 운영 사고와 같은 자리에 오면 진짜 사고가 묻히기 때문이다(ADR 0046 결정 6).
# 이 토큰이 유출돼도 할 수 있는 일은 그 방에 글을 쓰는 것뿐이다. 클러스터나 DB에 닿지 않는다.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-alerting
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/alerting
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-alerting
    secretNamespace: eatbid
    creationPolicy: Orphan
---
# 관측 화면의 자격 셋. Grafana 관리자, Grafana가 PostgreSQL을 읽는 `eatbid_grafana` 역할의 비밀번호,
# OpenObserve 루트 사용자(fluent-bit도 이것으로 로그를 밀어 넣는다). 셋 다 클러스터 안 화면에만
# 닿고 원본·업무 사실을 쓰지 못한다(EAT-174, 관측 계획 4단계).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: eatbid-observability
  namespace: eatbid
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: eatbid-az9z
        envSlug: prod
        secretsPath: /runtime/observability
      credentialsRef:
        secretName: eatbid-infisical-operator
        secretNamespace: eatbid
  managedSecretReference:
    secretName: eatbid-observability
    secretNamespace: eatbid
    creationPolicy: Orphan