apiVersion: v1
kind: Namespace
metadata:
  name: eatbid
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
  namespace: eatbid
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eatbid
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # 기본값으로 두면 36GB DB가 캐시 128MB로 돈다. 2026-09-19 20시 KST에 외부 사용자가 열린 공고
          # 목록을 못 봤고, 같은 조회가 208ms와 2,990ms를 오갔다 — 캐시에 있으면 빠르고 없으면 디스크다.
          # 백필이 하루 종일 수백만 행을 쓰고 매시간 pg_dump가 표를 통째로 읽으므로(실측 표당 9초) 그
          # 128MB는 계속 밀려난다. 같은 이유로 mart 회수 대상을 세는 감시 질의가 105초·285초 걸렸다.
          #
          # shared_buffers 2GB는 노드 12GB의 약 17%다. 표준 권고는 기계 RAM의 25%이지만 이 노드는
          # web·server·Grafana·OpenObserve와 나눠 쓰므로 그보다 낮춰 잡는다. effective_cache_size는
          # 할당이 아니라 계획 힌트이고, work_mem은 연결당·연산당이라 21개 연결 기준 최악 약 700MB다.
          args:
            - -c
            - shared_buffers=2GB
            - -c
            - effective_cache_size=6GB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=512MB
          env:
            - { name: POSTGRES_USER, value: eatbid }
            - { name: POSTGRES_PASSWORD, value: eatbid }
            - { name: POSTGRES_DB, value: eatbid }
          ports: [{ containerPort: 5432 }]
          # requests만 두고 memory limit은 두지 않는다. 한도에 닿으면 OOM killer가 진실의 주인을 죽여
          # 제품 전체가 멎는다. requests가 있으면 QoS가 Burstable이 되어, 노드가 빡빡할 때 아직
          # BestEffort인 백필 파드가 먼저 밀려난다 — 그 순서가 우리가 원하는 것이다.
          resources:
            requests: { cpu: 500m, memory: 3Gi }
          volumeMounts: [{ name: pgdata, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "eatbid"] }
            periodSeconds: 3
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: pgdata }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: eatbid
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: eatbid
spec:
  replicas: 1
  selector: { matchLabels: { app: server } }
  template:
    metadata: { labels: { app: server } }
    spec:
      containers:
        - name: server
          image: eatbid-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, value: "postgres://eatbid:eatbid@postgres:5432/eatbid" }
            # Better Auth — Secret eatbid-auth 에 리더가 실값 주입
            # kubectl -n eatbid create secret generic eatbid-auth             #   --from-literal=BETTER_AUTH_SECRET=... --from-literal=GOOGLE_CLIENT_ID=...             #   --from-literal=GOOGLE_CLIENT_SECRET=...
            # ⚠ optional: true 를 뗐다. 그게 조용한 실패였다 —
            #   Secret 이 없으면 파드가 **정상적으로 뜨고 인증만 조용히 망가진다.**
            #   `?? 기본값`·`|| true` 와 같은 모양이다. 특히 새 기계 부트스트랩에서
            #   Secret 주입을 빠뜨려도 클러스터가 초록으로 통과하고, 사장이 로그인할
            #   때 처음 드러난다. 뗀 지금은 CreateContainerConfigError 로 시끄럽게 멈춘다.
            #
            #   뗄 수 있는 근거(2026-08-28 실측): 세 키가 eatbid-auth 에 실재하고
            #   도는 파드가 셋 다 채워서 갖고 있다. 인증 미구현 기간은 끝났다.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: eatbid-auth, key: BETTER_AUTH_SECRET }
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: eatbid-auth, key: GOOGLE_CLIENT_ID }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: eatbid-auth, key: GOOGLE_CLIENT_SECRET }
            - { name: BETTER_AUTH_URL, value: "https://eatbid.net" }
          ports: [{ containerPort: 4400 }]
          livenessProbe:
            httpGet: { path: /health/live, port: 4400 }
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: 4400 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: eatbid
spec:
  selector: { app: server }
  ports: [{ port: 80, targetPort: 4400 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eatbid
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: eatbid-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_URL, value: "http://server" }
          ports: [{ containerPort: 3000 }]
          # probe 경로는 실제 Next page 라우트여야 한다. 라우트를 지우면 파드가 영영 Ready가 안 되는데
          # 원인이 커밋 diff에 안 보인다(2026-09-09 `/dashboard/today` 삭제, EAT-126).
          # `infra/tests/test_server_health_probes.py`가 이 경로를 `apps/web/src/app`과 대조한다.
          readinessProbe:
            httpGet: { path: /today, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: eatbid
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server
  namespace: eatbid
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: server, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
