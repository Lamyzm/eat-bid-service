apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-mart-reap
  namespace: eatbid
spec:
  schedules:
    # 하루 한 번, 수집이 없는 새벽. 정각은 backfill-advance, 5분은 백업, 3·18·33·48분은 감시가 쓰고
    # poll-open은 08~19시라 04:30은 아무것과도 겹치지 않는다. 보존 기간이 하루·이레 단위라 이보다 자주
    # 돌 이유가 없고, 2026-09-16 실측에서 하루 66번 물리는 mart가 하루치만 남기면 20GB가 6GB대가 된다.
    - "30 4 * * *"
  timezone: Asia/Seoul
  suspend: false
  # 앞 회차가 아직 지우고 있으면 건너뛴다. 첫 회수는 수천만 행이라 한 회차가 길 수 있고, 겹쳐 돌면 같은
  # build를 둘이 지우려다 잠금을 다툰다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    entrypoint: reap-marts
    # 수집·감시보다 낮다. 회수는 하루 늦어도 되는 일이다.
    priority: 10
