apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-mart-reap
  namespace: eatbid
spec:
  schedules:
    # 매시 45분. 정각은 backfill-advance, 5분은 백업, 25분은 replay-advance, 3·18·33·48분은 감시,
    # 10분 단위는 poll-open이 쓰므로 45분이 비어 있다.
    #
    # 예전에는 하루 한 번(04:30)이었다. 2026-09-16에는 한 벌이 작아 "하루치만 남기면 20GB가 6GB대"였는데,
    # 백필로 한 벌이 열 배쯤 커지자 하루 반치 사본 46벌이 55GB를 들고 노드 디스크를 채웠다(2026-10-07,
    # EAT-303). 회차 요약·분포의 보존을 3시간으로 줄였으므로 회수도 그 단위로 돌아야 사본이 쌓이지 않는다.
    - "45 * * * *"
  timezone: Asia/Seoul
  suspend: false
  # 앞 회차가 아직 지우고 있으면 건너뛴다. 첫 회수는 수천만 행이라 한 회차가 길 수 있고, 겹쳐 돌면 같은
  # build를 둘이 지우려다 잠금을 다툰다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    entrypoint: reap-marts
    # 수집·감시보다 낮다. 회수는 하루 늦어도 되는 일이다.
    priority: 10
