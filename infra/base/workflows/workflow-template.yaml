apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: eatbid-dataplane
  namespace: eatbid
spec:
  entrypoint: scheduled-pipeline
  serviceAccountName: eatbid-dataplane
  # fan-out 폭을 단일 노드 용량 아래로 묶는다. 2026-09-05 첫 backfill은 normalize 131개를 한꺼번에
  # 띄워 kubelet pod 상한(110)을 넘기고 postgres readiness까지 지연시켜 22건이 DB 연결 시간 초과로
  # 죽었다.
  #
  # 16으로 올린다(2026-09-14, EAT-180). backfill capture semaphore가 8이 되면서 capture pod 여덟이 이
  # 상한을 다 차지할 수 있고, 그러면 같은 창의 normalize가 뒤에서 굶는다. 8 + 8로 두 단계가 서로를
  # 막지 않게 한다. kubelet 상한 110에서 여전히 멀다. 파드마다 psycopg 연결 하나를 여므로 16은 단일
  # 노드 postgres의 기본 max_connections 100 안에 넉넉히 든다.
  parallelism: 16
  # 완료 파드와 끝난 Workflow를 컨트롤러가 스스로 지운다. 2026-09-09 실측에서 Workflow 38개가 파드 6,561개를
  # 남겨 단일 노드 API 서버·etcd를 눌렀다(EAT-127). 성공한 파드는 즉시 지우고(로그는 단계 결과가 DB·R2에
  # 남으므로 파드가 증거가 아니다), 실패한 파드는 원인 확인을 위해 Workflow가 지워질 때까지 둔다.
  # 실패 Workflow를 하루 두는 이유는 fail-release·재개(EAT-122) 판단이 그 안에서 이뤄지기 때문이다.
  podGC:
    strategy: OnPodSuccess
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400
  arguments:
    parameters:
      # mode는 CLI `discover --mode`로 그대로 전달되고 날짜 창은 CLI가 번역한다. poll-open과
      # daily-reconcile은 start-date/end-date를 비워 두어야 하며, backfill submit만 두 날짜를 채운다.
      # backfill은 source semaphore도 별도 key(eatbid-source-backfill)로 잡아야 스케줄 수집을 압도하지
      # 않으므로 entrypoint를 backfill-pipeline으로 함께 바꾼다(2026-09-11, EAT-164 — 아래 discover·
      # discover-backfill 주석).
      #   argo submit --from workflowtemplate/eatbid-dataplane -n eatbid --entrypoint backfill-pipeline \
      #     -p mode=backfill -p start-date=20250901 -p end-date=20251130
      - name: mode
        value: poll-open
      # 기본값은 상세 응답의 명단·낙찰·재공고 블록을 읽으면서 참가제한지역 라벨까지 싣는 version이다
      # (eat-v3, ADR 0038). 라벨이 없으면 행안부 매핑이 비어 지역 모집단이 잠긴다. 이 값은 그 version을
      # 아는 이미지(v0.1.21)가 배포된 뒤에 올렸다 — 템플릿이 이미지보다 먼저 동기화되면 옛 이미지가
      # 모르는 이름을 받는다(EAT-95). 이미 봉인된 v1·v2 발행물은 그대로 두고 replay로 revision을 더한다.
      # eat-v4는 단독입찰 처리 방법(`SGNS_BID_PRCS_MTHD_CD`)을 `terms.soloBidMethod`로 싣는다(EAT-249). 봉인된 v3 발행물은 그대로
      # 두고 replay로 revision을 더한다.
      # eat-v5는 게시 종류(`PBANC_CHG_GB_CD`)를 `lineage.changeKind`로 싣는다(EAT-262). 재입찰의 진짜 신호가 이 코드이며
      # `RBID_YN`이 아니다. eat-v4는 이미 배포돼 정시 수집이 그 이름으로 payload를 봉인했으므로 고치지 않고 이름을 더한다.
      - name: parser-version
        value: eat-v5
      # mart 계산 규칙의 version이다. parser-version과 같은 자리에 두는 이유는 둘 다 "이 실행이 어떤
      # 해석 규칙으로 만든 결과인가"를 기록하는 값이고, 규칙을 바꾼 배포가 옛 build를 조용히 덮어쓰지
      # 않으려면 새 값으로 새 build를 만들어야 하기 때문이다(ADR 0034).
      # mart-r2는 열린 공고 스냅샷이 최신 상세 해석의 하한율·품목·지역·기관 라벨을 함께 싣는
      # 계산 규칙이다(EAT-68). mart-r3는 예정가격이 0으로 관측된(추첨 전) 회차의 그날 하한·투찰률 축
      # 낙찰률·하한 미만 수를 0이 아니라 null로 두는 규칙이다(EAT-74). mart-r4는 열린 공고 스냅샷이
      # 최신 상세 해석의 제목·공고번호를 함께 싣는 규칙이다(EAT-247·248) — 검색과 eaT 손잡이가 이 두 열을
      # 읽는다. mart-r5는 스냅샷 행마다 품목 원자 다리표(`open_auction_snapshot_item`)를 함께 만드는 규칙이다
      # (EAT-230) — 품목 축이 라벨 부분일치가 아니라 코드 조인으로 거른다. 옛 build를 덮어쓰지 않고 새 build로
      # 만들어 전환한다.
      # mart-r6는 스냅샷이 단독입찰 처리 방법 코드를 함께 싣는 규칙이다(EAT-249). mart-r7은 회차 요약의 품목이 단일 열이
      # 아니라 다리표(`org_round_summary_item`)이고 낙찰률 분포의 빈 품목 축을 없앤 규칙이다(EAT-256). mart-r8은 개찰이
      # 공고보다 45일 넘게 뒤인 회차에 격리 사유를 달고 스냅샷이 그런 마감을 싣지 않는 규칙이다(EAT-199).
      # mart-r9는 스냅샷이 게시 종류 코드를 함께 싣는 규칙이다(EAT-262). mart-r10은 회차 요약이 eaT 공고지역
      # 두 열을 함께 싣는 규칙이다(EAT-198) — 비교군을 지역으로 좁히는 분석이 요청마다 core를 조인하지 않게 한다.
      - name: calc-version
        value: mart-r10
      - name: start-date
        value: ""
      - name: end-date
        value: ""
      - name: release-name
        value: ""
      # 백필이 뒤로 갈 바닥이다. 이 값을 미는 커밋 하나가 그 해의 수집을 시작시키고, 그 커밋이 운영자
      # 승인이다(ADR 0052 결정 5). 전진 CronWorkflow만 읽으며 사람이 부르는 backfill-pipeline은 쓰지
      # 않는다. 2025-09로 시작한 이유는 지난 1년의 구멍을 먼저 메우기 위해서였다 — 구멍은 숫자를 얇게
      # 만드는 것이 아니라 틀리게 만든다(결정 6). 2026-09-16 그 1년이 닫혀(2025-09 한 창의 계약 결정만 남음)
      # 2023-09로 민다(EAT-253). 연치당 core+ingest 약 10GB, 한 시간에 달 하나라 2년은 나흘이다.
      # 2026-09-17 그 조건이 충족돼 2021-09로 민다(EAT-269). mart 옛 build 회수(EAT-254)가 build 629개·
      # 6,121만 행을 지우고 VACUUM FULL로 파일을 돌려받아 mart 20GB → 2.9GB, DB 34GB → 19GB, 볼륨 여유
      # 84GB → 93GB가 됐다. 추가 2년은 약 20GB라 여유 안에 든다. 실패한 창은 바닥과 무관하게 남으므로
      # replay로 따로 닫는다(ADR 0053).
      - name: backfill-floor-date
        value: "20210901"
  templates:
    - name: scheduled-pipeline
      dag:
        tasks:
          # 각 task를 anchor로 남겨 backfill-pipeline(아래)이 discover·capture 둘만 backfill 전용
          # template으로 바꾸고 나머지 넷은 정의를 그대로 재사용한다. semaphore key 분리 이유는
          # infra/base/workflows/semaphore.yaml, template을 나눈 이유는 discover 주석을 본다.
          - &task-discover
            name: discover
            template: discover
          - &task-capture
            name: capture
            template: capture
            dependencies: [discover]
            # chunk 하나가 상세 pod 하나다. 건당 pod를 띄우면 건당 약 17초 중 10초가 pod 생성·종료
            # 비용이라 한 달 백필이 80시간이 된다(EAT-51 증거 §6). CLI가 chunk를 순차로 관측하므로
            # 건별 raw 저장·request unit grain은 그대로고 pod 수만 줄어든다.
            withParam: "{{tasks.discover.outputs.parameters.external-bid-id-chunks}}"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: external-bid-ids-json
                  value: "{{item}}"
          - &task-normalize
            name: normalize
            template: normalize
            dependencies: [capture]
            # 확장된 capture의 output parameter `observation-ids`가 chunk마다 하나씩 모인다. capture가
            # 묶은 그 단위를 그대로 이어받아 정규화도 pod 하나가 chunk 하나를 돈다.
            withParam: "{{tasks.capture.outputs.parameters.observation-ids}}"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: observation-ids-json
                  value: "{{item}}"
          - &task-validate
            name: validate
            template: validate
            dependencies: [normalize]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"
          - &task-project
            name: project
            template: project
            dependencies: [validate]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"
          - &task-marts
            name: marts
            template: marts
            dependencies: [project]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"

    # ad hoc backfill 전용 DAG다(2026-09-11, EAT-164). Argo Workflows는 semaphore의
    # `synchronization.semaphores[].configMapKeyRef.key`에 `{{workflow.parameters.mode}}` 같은 치환을
    # 지원한다는 근거가 없다 — 공식 문서의 semaphore 예시는 모두 고정 문자열이고, dynamic key 요청
    # (argoproj/argo-workflows#11890, 2023-09, 미해결)도 현재 semaphore key는 ConfigMap에 미리 정의된
    # 고정 값만 받는다고 전제한다. 그래서 scheduled-pipeline과 같은 discover·capture template 안에서
    # mode로 key를 바꾸는 대신, discover-backfill·capture-backfill이라는 변형을 따로 두고 이 DAG가
    # 그것만 부른다. normalize·validate·project·marts는 scheduled-pipeline의 task 정의를 anchor로 그대로
    # 공유한다 — semaphore가 없는 단계라 나눌 이유가 없다. backfill은 사람이
    # `argo submit --from workflowtemplate/eatbid-dataplane --entrypoint backfill-pipeline
    # -p mode=backfill ...`로 부르며 CronWorkflow로 스케줄하지 않는다 — infra/tests가 "backfill"이
    # 어떤 CronWorkflow 렌더에도 없음을 고정한다.
    - name: backfill-pipeline
      dag:
        tasks:
          - <<: *task-discover
            template: discover-backfill
          - <<: *task-capture
            template: capture-backfill
          - *task-normalize
          - *task-validate
          - *task-project
          - *task-marts

    # 아침 재대조 전용 DAG다(2026-09-18, EAT-275). scheduled-pipeline과 단계는 완전히 같고 discover·
    # capture만 재대조 전용 semaphore key를 쓰는 변형으로 바꾼다.
    #
    # 왜 나누나. 재대조와 poll-open이 같은 key를 쓰면 재대조가 도는 몇 시간 동안 정시 수집이 자리를
    # 못 잡는다. capacity를 올려서는 풀리지 않는다 — 아직 Pending인 chunk가 pod를 기다리는 동안 이미
    # semaphore를 쥐므로 chunk 수백 개가 자리를 전부 채운다(2026-09-18 v0.1.48로 실측). backfill을
    # 나눈 것과 같은 이유이며 같은 방법이다.
    #
    # mode는 CronWorkflow가 daily-reconcile로 넘긴다. entrypoint를 비우면 scheduled-pipeline이 불려
    # 다시 같은 key를 잡으므로 daily-reconcile.yaml이 entrypoint를 명시한다.
    - name: reconcile-pipeline
      dag:
        tasks:
          - <<: *task-discover
            template: discover-reconcile
          - <<: *task-capture
            template: capture-reconcile
          - *task-normalize
          - *task-validate
          - *task-project
          - *task-marts

    # 스스로 전진하는 백필이다(2026-09-14, EAT-209, ADR 0052 결정 4).
    #
    # 왜 새 진입점인가. backfill-pipeline은 창을 workflow 파라미터로 받는다 — 사람이 정해 주는 모양이다.
    # 여기서는 첫 단계가 커버리지를 읽어 창을 정하고 그 결과를 뒤로 넘긴다. 기존 진입점을 고치지 않고
    # 더하는 이유는 같은 template을 라이브 수집이 쓰기 때문이다. 고치면 그쪽이 함께 흔들린다.
    #
    # 고를 창이 없으면 `run`이 건너뛰어지고 workflow는 아무것도 하지 않은 채 성공한다. 그것이 "범위 안을
    # 다 채웠다"의 정상 상태다.
    # 고를 창이 없으면 `run`이 건너뛰어지고 workflow는 아무것도 하지 않은 채 성공한다. 그것이 "다시
    # 시도할 것이 없다"의 정상 상태다. replay는 관측 목록을 받지 않고 release 전체를 재처리한다.
    - name: advancing-replay-pipeline
      dag:
        tasks:
          - name: decide
            template: next-replay-target
          - name: run
            template: replay
            depends: decide
            when: "{{tasks.decide.outputs.parameters.has-target}} == true"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.decide.outputs.parameters.source-release-id}}"
                # 비운다 = release 전체를 재처리한다(EAT-274). DAG task는 template의 기본값을 상속하지
                # 않고 모든 input을 넘겨야 하므로 빈 값을 명시한다 — 생략하면 spec 검증이 거부한다.
                # 비운다 = release 전체를 재처리한다(EAT-274). DAG task는 template의 기본값을 상속하지
                # 않고 모든 input을 넘겨야 하므로 빈 값을 명시한다 — 생략하면 spec 검증이 거부한다.
                - name: observation-ids-json
                  value: ""
                # 실패한 publication id를 다시 쓰지 않는다. decide가 run에서 결정적으로 파생한다.
                - name: publication-id
                  value: "{{tasks.decide.outputs.parameters.publication-id}}"
                - name: started-at
                  value: "{{tasks.decide.outputs.parameters.started-at}}"
                - name: normalized-at
                  value: "{{tasks.decide.outputs.parameters.normalized-at}}"
                - name: validated-at
                  value: "{{tasks.decide.outputs.parameters.validated-at}}"
                - name: activated-at
                  value: "{{tasks.decide.outputs.parameters.activated-at}}"
          - name: marts
            template: marts
            depends: run
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.decide.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{workflow.uid}}"
                - name: publication-id
                  value: "{{tasks.decide.outputs.parameters.publication-id}}"

    - name: advancing-backfill-pipeline
      dag:
        tasks:
          - name: decide
            template: next-backfill-window
          - name: run
            template: windowed-backfill-pipeline
            depends: decide
            when: "{{tasks.decide.outputs.parameters.has-window}} == true"
            arguments:
              parameters:
                - name: start-date
                  value: "{{tasks.decide.outputs.parameters.start-date}}"
                - name: end-date
                  value: "{{tasks.decide.outputs.parameters.end-date}}"

    # backfill-pipeline과 같은 DAG인데 창을 workflow 파라미터가 아니라 입력으로 받는다. discover만
    # 그 차이를 알고 나머지 다섯은 정의를 그대로 재사용한다.
    - name: windowed-backfill-pipeline
      inputs:
        parameters:
          - name: start-date
          - name: end-date
      dag:
        tasks:
          - <<: *task-discover
            template: discover-backfill-windowed
            arguments:
              parameters:
                - name: start-date
                  value: "{{inputs.parameters.start-date}}"
                - name: end-date
                  value: "{{inputs.parameters.end-date}}"
          - <<: *task-capture
            template: capture-backfill
          - *task-normalize
          - *task-validate
          - *task-project
          - *task-marts

    # 정부 코드 reference 적재다. eaT 수집과 같은 template·이미지·serviceaccount로 돌지만 발견도
    # fan-out도 없다. 파일 하나가 곧 관측 하나이고 release 하나여서 단계가 둘뿐이다(ADR 0035).
    # 별도 CronJob이나 스케줄러를 만들지 않는다(AGENTS 9).
    - name: reference-pipeline
      inputs:
        parameters:
          # source·dataset의 요청 모양과 컬럼 계약은 검토된 source 계약이 갖는다. 여기서는 어느
          # 계약을 실행할지의 이름만 고른다.
          - name: reference-source
            value: mois-standard-code
          - name: reference-dataset
            value: legal-dong
          # 정부 파일 파서의 version이다. eaT parser-version과 별개인 이유는 두 소스의 해석 규칙이
          # 서로 무관하게 움직이기 때문이다.
          - name: reference-parser-version
            value: mois-v1
      dag:
        tasks:
          - name: capture-reference
            template: capture-reference
            arguments:
              parameters:
                - name: reference-source
                  value: "{{inputs.parameters.reference-source}}"
                - name: reference-dataset
                  value: "{{inputs.parameters.reference-dataset}}"
                - name: reference-parser-version
                  value: "{{inputs.parameters.reference-parser-version}}"
          - name: project-reference
            template: project-reference
            dependencies: [capture-reference]
            arguments:
              parameters:
                - name: reference-source
                  value: "{{inputs.parameters.reference-source}}"
                - name: reference-dataset
                  value: "{{inputs.parameters.reference-dataset}}"
                - name: reference-parser-version
                  value: "{{inputs.parameters.reference-parser-version}}"
                - name: source-release-id
                  value: "{{tasks.capture-reference.outputs.parameters.source-release-id}}"
                - name: observation-id
                  value: "{{tasks.capture-reference.outputs.parameters.observation-id}}"
                # 수집이 쓴 release 이름을 그대로 받는다. 두 단계가 각자 이름을 지으면 같은 실행에서
                # 다른 release를 가리킨다.
                - name: release-name
                  value: "{{tasks.capture-reference.outputs.parameters.release-name}}"

    # eaT 코드목록도 발견도 fan-out도 없다. 왕복 하나가 곧 관측 하나이고 release 하나여서 단계가
    # 둘뿐이다(EAT-187). 어느 그룹을 묻는지는 파라미터가 아니라 검토된 코드목록 표가 정하므로 이
    # DAG는 실행 정체성만 나른다. 별도 CronJob이나 스케줄러를 만들지 않는다(AGENTS 9).
    - name: code-vocabulary-pipeline
      dag:
        tasks:
          - name: capture-code-vocabulary
            template: capture-code-vocabulary
          - name: project-code-vocabulary
            template: project-code-vocabulary
            dependencies: [capture-code-vocabulary]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.capture-code-vocabulary.outputs.parameters.source-release-id}}"
                - name: observation-id
                  value: "{{tasks.capture-code-vocabulary.outputs.parameters.observation-id}}"

    # replay는 ad hoc 실행이지만 core를 다시 앉힌 뒤 mart를 다시 만들지 않으면 화면이 옛 build를
    # 계속 읽는다. replay 전용 DAG를 따로 두어 예약 실행과 같은 marts task를 잇는다.
    - name: replay-pipeline
      inputs:
        parameters:
          - name: source-release-id
          - name: publication-id
          # 비우면 release 전체다(EAT-274). 사람이 부분 재처리할 때만 배열을 준다.
          - name: observation-ids-json
            value: ""
          - name: started-at
          - name: normalized-at
          - name: validated-at
          - name: activated-at
      dag:
        tasks:
          - name: replay
            template: replay
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{inputs.parameters.source-release-id}}"
                - name: publication-id
                  value: "{{inputs.parameters.publication-id}}"
                - name: observation-ids-json
                  value: "{{inputs.parameters.observation-ids-json}}"
                - name: started-at
                  value: "{{inputs.parameters.started-at}}"
                - name: normalized-at
                  value: "{{inputs.parameters.normalized-at}}"
                - name: validated-at
                  value: "{{inputs.parameters.validated-at}}"
                - name: activated-at
                  value: "{{inputs.parameters.activated-at}}"
          - name: marts
            template: marts
            dependencies: [replay]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{inputs.parameters.source-release-id}}"
                # replay는 discovery 없이 workflow uid 하나로 돌므로 run 정체성이 그것뿐이다.
                - name: detail-run-id
                  value: "{{workflow.uid}}"
                - name: publication-id
                  value: "{{inputs.parameters.publication-id}}"

    - &tmpl-discover
      name: discover
      # capacity를 live/backfill로 나눈 이유는 semaphore.yaml, discover-backfill로 template을 나눈
      # 이유는 backfill-pipeline 주석(위)을 본다. discover-backfill은 이 template 전체를 anchor로
      # 물려받고 synchronization만 바꾼다.
      inputs:
        parameters:
          # 창을 입력으로 받되 기본값이 지금까지의 출처인 workflow 파라미터다. 부르는 쪽이 넘기지
          # 않으면 동작이 예전과 같고, 전진 pipeline만 앞 단계가 고른 창을 넘긴다(EAT-209).
          - name: start-date
            value: "{{workflow.parameters.start-date}}"
          - name: end-date
            value: "{{workflow.parameters.end-date}}"
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-live
      outputs:
        parameters:
          # CLI `--result-dir`가 machine result의 key마다 남긴 파일이다. 뒤 단계는 이 값만 받는다.
          - name: source-release-id
            valueFrom:
              path: /tmp/eatbid/source_release_id
          - name: detail-run-id
            valueFrom:
              path: /tmp/eatbid/detail_run_id
          - name: publication-id
            valueFrom:
              path: /tmp/eatbid/publication_id
          # capture fan-out 단위다. 평평한 `external_bid_ids`도 같은 디렉터리에 남지만 output
          # parameter로 내보내지 않는다. 피크 월 17,000건이면 그 목록만으로 workflow status가
          # 수백 KB 늘어나는데 아무 단계도 그것을 읽지 않는다.
          - name: external-bid-id-chunks
            valueFrom:
              path: /tmp/eatbid/external_bid_id_chunks
          - name: discovered-count
            valueFrom:
              path: /tmp/eatbid/discovered_count
          # poll-open이 목록 신호로 좁힌 결과다. 회차마다 몇 건을 왜 다시 불렀는지를 workflow status에서
          # 읽을 수 있어야 정책의 요청 수 효과를 pod 로그 없이 실측한다(ADR 0037). 이유별 집계 JSON
          # 객체 하나라 크기는 발견 건수와 무관하다.
          # default는 템플릿이 이미지보다 먼저 동기화되는 창(EAT-95)에서 옛 이미지가 이 파일을 안 만들어
          # discover output 해석이 실패하는 것을 막는다. 값이 없다는 뜻이지 0건이 아니다.
          - name: detail-count
            valueFrom:
              path: /tmp/eatbid/detail_count
              default: ""
          - name: refetch-reasons
            valueFrom:
              path: /tmp/eatbid/refetch_reasons
              default: "{}"
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import os
            import sys
            import uuid

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                run_id = uuid.UUID(os.environ["EATBID_RUN_ID"])
            except (KeyError, ValueError):
                fail("EATBID_RUN_ID must be the workflow UUID")
            mode = os.environ.get("EATBID_WORKFLOW_MODE", "")
            created_at = os.environ.get("EATBID_WORKFLOW_CREATED_AT", "")
            result_dir = os.environ.get("EATBID_RESULT_DIR", "")
            if not mode or not created_at or not result_dir:
                fail("EATBID_WORKFLOW_MODE, EATBID_WORKFLOW_CREATED_AT, EATBID_RESULT_DIR are required")

            # 한 workflow의 release, detail run, publication 정체성은 workflow uid에서 결정적으로
            # 파생한다. 같은 pod가 다시 뜨면 새 정체성을 만들어 고아 run을 남기는 대신 같은 정체성으로
            # 충돌해 멈춘다. discovery run 자체는 workflow uid 그대로다.
            source_release_id = uuid.uuid5(run_id, "eatbid:source-release")
            detail_run_id = uuid.uuid5(run_id, "eatbid:detail-run")
            publication_id = uuid.uuid5(run_id, "eatbid:publication")
            release_name = os.environ.get("EATBID_RELEASE_NAME") or f"{mode} {created_at} {run_id}"

            os.makedirs(result_dir, exist_ok=True)
            with open(os.path.join(result_dir, "publication_id"), "w", encoding="utf-8") as handle:
                handle.write(str(publication_id))

            argv = [
                "eatbid", "discover",
                "--mode", mode,
                "--run-id", str(run_id),
                "--source-release-id", str(source_release_id),
                "--detail-run-id", str(detail_run_id),
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_PARSER_VERSION"],
                "--release-name", release_name,
                # 워크플로 이름을 run 행에 남긴다 — 알림의 run_id에서 R2 로그 경로로 바로 가기 위해(EAT-231).
                *(["--workflow-name", workflow_name] if (workflow_name := os.environ.get("EATBID_WORKFLOW_NAME")) else []),
                "--as-of", created_at,
                "--started-at", created_at,
                "--completed-at", created_at,
                "--start-date", os.environ.get("EATBID_START_DATE", ""),
                "--end-date", os.environ.get("EATBID_END_DATE", ""),
                # 월 창 TOT_CNT 약 17,000이 SOURCE_PAGE_BUDGET(기본 100) 안에 들려면 CLI 기본 100이
                # 아니라 계약 상한 page size로 불러야 한다.
                "--page-size", os.environ["EATBID_DISCOVER_PAGE_SIZE"],
                "--result-dir", result_dir,
            ]
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - name: EATBID_WORKFLOW_NAME
            value: "{{workflow.name}}"
          - &env-run-id
            name: EATBID_RUN_ID
            value: "{{workflow.uid}}"
          - &env-parser-version
            name: EATBID_PARSER_VERSION
            value: "{{workflow.parameters.parser-version}}"
          - &env-created-at
            name: EATBID_WORKFLOW_CREATED_AT
            value: "{{workflow.creationTimestamp}}"
          - &env-result-dir
            name: EATBID_RESULT_DIR
            value: /tmp/eatbid
          - name: EATBID_START_DATE
            value: "{{inputs.parameters.start-date}}"
          - name: EATBID_END_DATE
            value: "{{inputs.parameters.end-date}}"
          - name: EATBID_RELEASE_NAME
            value: "{{workflow.parameters.release-name}}"
          - name: EATBID_DISCOVER_PAGE_SIZE
            value: "1000"
          - &env-database-url
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: eatbid-database-dataplane
                key: DATABASE_URL
          - &env-r2-endpoint
            name: R2_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_ENDPOINT_URL
          - &env-r2-bucket
            name: R2_BUCKET
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_BUCKET
          - &env-r2-access-key
            name: R2_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_ACCESS_KEY_ID
          - &env-r2-secret-key
            name: R2_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_SECRET_ACCESS_KEY

    # discover와 완전히 같은 container·outputs를 anchor로 물려받고 semaphore key만 backfill 전용으로
    # 바꾼 변형이다. backfill-pipeline만 이 template을 부른다.
    - <<: *tmpl-discover
      name: discover-backfill
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-backfill

    # discover와 같은 container·outputs를 anchor로 물려받고 semaphore key만 재대조 전용으로 바꾼
    # 변형이다. reconcile-pipeline만 이 template을 부른다. 나눈 이유는 그 DAG 주석을 본다.
    - <<: *tmpl-discover
      name: discover-reconcile
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-reconcile

    - &tmpl-capture
      name: capture
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: external-bid-ids-json
      synchronization:
        semaphores:
          # semaphore는 chunk pod 단위로 잡힌다. chunk가 커져도 소스 동시 호출은 여전히 capacity를
          # 넘지 않는다. capacity를 live/backfill로 나눈 이유는 semaphore.yaml을 본다.
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-live
      outputs:
        parameters:
          - name: observation-ids
            valueFrom:
              path: /tmp/eatbid/observation_ids
              # poll-open이 목록 신호로 좁혀 상세 0건이면 discover의 chunk가 `[]`라 capture 자체가
              # "Skipped, empty params"로 건너뛰어진다. Argo v4.0.8은 건너뛴 task의 선언된 output에
              # 이 default만 채우므로(addSkippedNodeOutputsToScope) 이 값이 없으면 normalize의
              # withParam이 해석되지 않아 빈 회차가 실패한다. 빈 회차도 목록 관측과 스냅샷 mart는
              # 발행해야 한다(ADR 0037).
              default: "[]"
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          # chunk는 JSON 배열 하나로 argv 한 칸에 들어간다. shell이 그 문자열을 쪼개거나 확장하지
          # 못하게 큰따옴표 안에서만 펼치고, 모양 검사는 CLI 인자 단계가 fail-closed로 한다.
          - >-
            exec eatbid capture --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --external-bid-ids-json "$EATBID_EXTERNAL_BID_IDS_JSON"
            --started-at "$EATBID_WORKFLOW_CREATED_AT"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - &env-source-release-id
            name: EATBID_SOURCE_RELEASE_ID
            value: "{{inputs.parameters.source-release-id}}"
          - &env-detail-run-id
            name: EATBID_DETAIL_RUN_ID
            value: "{{inputs.parameters.detail-run-id}}"
          - name: EATBID_EXTERNAL_BID_IDS_JSON
            value: "{{inputs.parameters.external-bid-ids-json}}"
          - *env-parser-version
          - *env-created-at
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    # 다음에 채울 창 하나를 고른다. 커버리지 view만 읽고 아무것도 바꾸지 않으므로 source semaphore도
    # core 발행 mutex도 잡지 않는다(EAT-209).
    #
    # floor-date를 뒤로 미는 커밋 하나가 그 해의 수집을 시작시킨다. 그 커밋이 운영자 승인이며, 매 실행을
    # 사람이 허락하던 것을 범위 선언 한 번으로 옮긴 것이다(ADR 0052 결정 5).
    # 발행이 실패한 창 중 다시 시도할 가치가 있는 것 하나를 고른다(EAT-274). 가치의 정의는 코드가
    # 갖는다 — 지금 이미지와 다른 이미지가 실패시킨 창만 고르므로 같은 결과를 무한히 반복하지 않는다.
    # 아무것도 바꾸지 않는 읽기라 semaphore도 mutex도 없다.
    - name: next-replay-target
      outputs:
        parameters:
          - name: has-target
            valueFrom:
              path: /tmp/eatbid/has_target
              # 고를 것이 없으면 뒤 단계가 건너뛰어져야 한다. 기본값이 없으면 그 정상 상태가 실패가 된다.
              default: "false"
          - name: source-release-id
            valueFrom:
              path: /tmp/eatbid/source_release_id
              default: ""
          - name: window-start
            valueFrom:
              path: /tmp/eatbid/window_start
              default: ""
          - name: publication-id
            valueFrom:
              path: /tmp/eatbid/publication_id
              default: ""
          - name: started-at
            valueFrom: { path: /tmp/eatbid/started_at, default: "" }
          - name: normalized-at
            valueFrom: { path: /tmp/eatbid/normalized_at, default: "" }
          - name: validated-at
            valueFrom: { path: /tmp/eatbid/validated_at, default: "" }
          - name: activated-at
            valueFrom: { path: /tmp/eatbid/activated_at, default: "" }
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid next-replay-target
            --run-id "$EATBID_RUN_ID"
            --build-sha "$BUILD_SHA"
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --result-dir "$EATBID_RESULT_DIR"
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
        env:
          - *env-run-id
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: next-backfill-window
      outputs:
        parameters:
          - name: has-window
            valueFrom:
              path: /tmp/eatbid/has_window
              # 고를 창이 없으면 뒤 단계가 건너뛰어져야 한다. 기본값이 없으면 그 정상 상태가 실패가 된다.
              default: "false"
          - name: start-date
            valueFrom:
              path: /tmp/eatbid/start_date
              default: ""
          - name: end-date
            valueFrom:
              path: /tmp/eatbid/end_date
              default: ""
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid next-backfill-window
            --floor-date "$EATBID_BACKFILL_FLOOR_DATE"
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_BACKFILL_FLOOR_DATE
            value: "{{workflow.parameters.backfill-floor-date}}"
          - *env-result-dir
          - *env-database-url
          # 이 명령은 view 하나를 읽을 뿐 R2를 건드리지 않는다. 그래도 다섯을 다 선언하는 이유는
          # ApplicationSettings가 명령별이 아니라 프로세스 단위 설정이기 때문이다 — 넷이 빠지면
          # 조립 전에 검증이 죽는다(2026-09-14 첫 전진 회차가 exit 64로 실패). fail-release도
          # 같은 이유로 R2를 쓰지 않으면서 선언한다.
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    # discover-backfill과 같은 container·semaphore인데, 부르는 쪽이 창을 입력으로 넘긴다. template
    # 정의는 anchor 하나를 공유하므로 창을 어디서 받느냐만 다르다.
    - <<: *tmpl-discover
      name: discover-backfill-windowed
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-backfill

    # capture와 완전히 같은 inputs·outputs·container를 anchor로 물려받고 semaphore key만 backfill
    # 전용으로 바꾼 변형이다. backfill-pipeline만 이 template을 부른다.
    - <<: *tmpl-capture
      name: capture-backfill
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-backfill

    # capture와 같은 inputs·outputs·container를 anchor로 물려받고 semaphore key만 재대조 전용으로
    # 바꾼 변형이다. reconcile-pipeline만 이 template을 부른다.
    - <<: *tmpl-capture
      name: capture-reconcile
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-reconcile

    - name: normalize
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: observation-ids-json
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid normalize --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --observation-ids-json "$EATBID_OBSERVATION_IDS_JSON"
            --normalized-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - name: EATBID_OBSERVATION_IDS_JSON
            value: "{{inputs.parameters.observation-ids-json}}"
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: validate
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid validate --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --validated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - &env-publication-id
            name: EATBID_PUBLICATION_ID
            value: "{{inputs.parameters.publication-id}}"
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: project
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      synchronization:
        mutexes:
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        # 2026-09-07 백필 창 16,410건의 project pod가 구성원 전체를 메모리에 올려 노드(allocatable 약
        # 12 GiB)를 통째로 잡아먹고 SystemOOM으로 죽었다(EAT-94). 4,023건 창은 한도 없이 통과했다.
        # 이제 project는 500건 batch로 흘러 상주 메모리가 batch 크기에 비례하므로 2 GiB면 넉넉하고,
        # limit이 있어야 잘못돼도 노드가 아니라 이 pod만 죽는다. requests는 그 절반으로 두어 다른
        # pod와 같은 노드에 들어갈 수 있게 한다.
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid project --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --activated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - *env-publication-id
          - *env-parser-version
          - &env-web-internal-url
            # web ClusterIP Service다. 터널·Ingress를 지나지 않으므로 `/internal` ipAllowList 규칙의
            # 판정 대상이 아니고, 이 값이 비면 무효화를 건너뛴다(발행은 실패시키지 않는다).
            name: EATBID_WEB_INTERNAL_URL
            value: http://web
          - &env-cache-revalidate-token
            name: EATBID_CACHE_REVALIDATE_TOKEN
            valueFrom:
              secretKeyRef:
                name: eatbid-database-dataplane
                key: EATBID_CACHE_REVALIDATE_TOKEN
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: marts
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      synchronization:
        mutexes:
          # core 발행과 다른 mutex를 쓴다. 같은 mutex면 mart 빌드가 다음 수집의 발행을 막아 소스
          # 관측이 늦어진다. mart는 파생물이라 stale이 정상 상태다(ADR 0011·0034).
          - name: eatbid-mart-build
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        # mart 빌드는 SQL이 PostgreSQL 안에서 돌고 Python은 목록 관측 페이지를 한 장씩 읽으므로 project보다
        # 작다. 그래도 한도를 두는 이유는 같다 — 발행 뒤의 이 pod가 노드를 잡아먹으면 다음 수집의 발행이
        # 같은 노드에서 죽는다(EAT-94). project와 같은 값으로 두어 두 단계의 한도를 한 자리에서 본다.
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        command: [/bin/sh, -ec]
        args:
          # --mart를 주지 않는다. 어느 mart가 이 발행의 영향 범위인지는 CLI가 발행이 실은 record
          # type으로 고르며, 그 판단이 여기와 코드 두 곳에 살면 갈라진다.
          # --region-scheme도 주지 않는다. 지역 코드 체계의 권위는 code scheme 표 하나뿐이고
          # 체계를 바꾸는 것은 새 calc-version의 배포 결정이다(AGENTS 6).
          - >-
            exec eatbid build-marts --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --calc-version "$EATBID_MART_CALC_VERSION"
            --as-of "$EATBID_WORKFLOW_CREATED_AT"
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - *env-publication-id
          - name: EATBID_MART_CALC_VERSION
            value: "{{workflow.parameters.calc-version}}"
          - *env-parser-version
          - *env-created-at
          - *env-result-dir
          - *env-web-internal-url
          - *env-cache-revalidate-token
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: capture-reference
      inputs:
        parameters:
          - name: reference-source
          - name: reference-dataset
          - name: reference-parser-version
      synchronization:
        semaphores:
          # eaT 스케줄 수집과 같은 eatbid-source-live를 쓴다(2026-09-11, EAT-164). 월 1회·짧게 끝나는
          # 실행이라 eatbid-source-backfill에 두면 backfill이 며칠 도는 동안 밀린다 — 기준정보는
          # 드물어도 제때 도는 것이 backfill과 나란히 대기하는 것보다 값이 크다.
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-live
      outputs:
        parameters:
          - name: source-release-id
            valueFrom:
              path: /tmp/eatbid/source_release_id
          - name: observation-id
            valueFrom:
              path: /tmp/eatbid/observation_id
          - name: release-name
            valueFrom:
              path: /tmp/eatbid/release_name
          - name: member-count
            valueFrom:
              path: /tmp/eatbid/member_count
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import os
            import sys
            import uuid

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                run_id = uuid.UUID(os.environ["EATBID_RUN_ID"])
            except (KeyError, ValueError):
                fail("EATBID_RUN_ID must be the workflow UUID")
            created_at = os.environ.get("EATBID_WORKFLOW_CREATED_AT", "")
            source = os.environ.get("EATBID_REFERENCE_SOURCE", "")
            dataset = os.environ.get("EATBID_REFERENCE_DATASET", "")
            if not created_at or not source or not dataset:
                fail("EATBID_WORKFLOW_CREATED_AT, EATBID_REFERENCE_SOURCE, EATBID_REFERENCE_DATASET are required")

            # release 정체성은 workflow uid에서 결정적으로 파생한다. 같은 pod가 다시 뜨면 새 정체성을
            # 만들어 고아 release를 남기는 대신 같은 정체성으로 충돌해 멈춘다.
            source_release_id = uuid.uuid5(run_id, "eatbid:reference-release")
            release_name = os.environ.get("EATBID_RELEASE_NAME") or f"{dataset} {created_at} {run_id}"

            argv = [
                "eatbid", "capture-reference",
                "--run-id", str(run_id),
                "--source-release-id", str(source_release_id),
                "--source", source,
                "--dataset", dataset,
                "--release-name", release_name,
                "--as-of", created_at,
                "--started-at", created_at,
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_REFERENCE_PARSER_VERSION"],
                "--result-dir", os.environ["EATBID_RESULT_DIR"],
            ]
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: reference
          - *env-run-id
          - &env-reference-source
            name: EATBID_REFERENCE_SOURCE
            value: "{{inputs.parameters.reference-source}}"
          - &env-reference-dataset
            name: EATBID_REFERENCE_DATASET
            value: "{{inputs.parameters.reference-dataset}}"
          - &env-reference-parser-version
            name: EATBID_REFERENCE_PARSER_VERSION
            value: "{{inputs.parameters.reference-parser-version}}"
          - *env-created-at
          - *env-result-dir
          - name: EATBID_RELEASE_NAME
            value: "{{workflow.parameters.release-name}}"
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

