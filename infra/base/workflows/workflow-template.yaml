        env:
          - name: EATBID_WORKFLOW_MODE
            value: code-vocabulary
          - *env-run-id
          - *env-source-release-id
          - *env-parser-version
          - name: EATBID_OBSERVATION_ID
            value: "{{inputs.parameters.observation-id}}"
          - *env-created-at
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: replay
      inputs:
        parameters:
          - name: source-release-id
          - name: publication-id
          - name: observation-ids-json
          - name: started-at
          - name: normalized-at
          - name: validated-at
          - name: activated-at
      synchronization:
        mutexes:
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import json
            import os
            import sys

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            # 비워 두면 그 release의 상세 관측 전부가 대상이고 CLI가 저장소에서 직접 읽는다(EAT-274).
            # 목록을 여기로 넘기면 1만 6천 건에서 parameter 하나가 128KiB를 넘어 파드도 뜨지 못한다.
            # 부분 재처리를 하는 사람은 지금처럼 배열을 준다.
            raw_ids = os.environ.get("EATBID_OBSERVATION_IDS_JSON", "").strip()
            observation_ids = []
            if raw_ids:
                try:
                    observation_ids = json.loads(raw_ids)
                except json.JSONDecodeError:
                    fail("observation-ids-json must be a JSON array")
                if not isinstance(observation_ids, list) or not observation_ids:
                    fail("observation-ids-json must be a non-empty JSON array")
                if any(
                    type(value) is not int
                    or value <= 0
                    or value > 9_223_372_036_854_775_807
                    for value in observation_ids
                ):
                    fail("every observation ID must be a positive bigint")
                if len(set(observation_ids)) != len(observation_ids):
                    fail("observation IDs must be unique")

            argv = [
                "eatbid", "replay",
                "--run-id", os.environ["EATBID_RUN_ID"],
                "--source-release-id", os.environ["EATBID_SOURCE_RELEASE_ID"],
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_PARSER_VERSION"],
                "--publication-id", os.environ["EATBID_PUBLICATION_ID"],
            ]
            for observation_id in observation_ids:
                argv.extend(("--observation-id", str(observation_id)))
            argv.extend((
                "--started-at", os.environ["EATBID_STARTED_AT"],
                "--normalized-at", os.environ["EATBID_NORMALIZED_AT"],
                "--validated-at", os.environ["EATBID_VALIDATED_AT"],
                "--activated-at", os.environ["EATBID_ACTIVATED_AT"],
            ))
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: replay
          - *env-run-id
          - *env-parser-version
          - *env-source-release-id
          - *env-publication-id
          - name: EATBID_OBSERVATION_IDS_JSON
            value: "{{inputs.parameters.observation-ids-json}}"
          - name: EATBID_STARTED_AT
            value: "{{inputs.parameters.started-at}}"
          - name: EATBID_NORMALIZED_AT
            value: "{{inputs.parameters.normalized-at}}"
          - name: EATBID_VALIDATED_AT
            value: "{{inputs.parameters.validated-at}}"
          - name: EATBID_ACTIVATED_AT
            value: "{{inputs.parameters.activated-at}}"
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    # 운영자 조사 entrypoint다(EAT-251, collection-runbook §4.7). 발행에 이르지 못한 상세 관측의 raw에 지금
    # 파서를 돌려 격리 사유 히스토그램을 만든다. DB에 쓰지 않고 R2는 읽기만 하며 소스를 부르지 않는다 —
    # 그래서 semaphore도 mutex도 없다. 결과는 result-dir의 파일과 stdout이다.
    - name: contract-scan
      inputs:
        parameters:
          - name: parser-version
            value: "{{workflow.parameters.parser-version}}"
          - name: limit
            value: "20000"
          - name: window-start
            value: ""
          - name: window-end
            value: ""
      outputs:
        parameters:
          - name: scanned
            valueFrom: { path: /tmp/eatbid/scanned }
          - name: quarantined
            valueFrom: { path: /tmp/eatbid/quarantined }
          - name: reasons
            valueFrom: { path: /tmp/eatbid/reasons }
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid scan-contract
            --parser-version "$EATBID_PARSER_VERSION"
            --limit "$EATBID_SCAN_LIMIT"
            --window-start "$EATBID_WINDOW_START" --window-end "$EATBID_WINDOW_END"
            --result-dir "$EATBID_RESULT_DIR"
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 1Gi
        env:
          - name: EATBID_PARSER_VERSION
            value: "{{inputs.parameters.parser-version}}"
          - name: EATBID_SCAN_LIMIT
            value: "{{inputs.parameters.limit}}"
          - name: EATBID_WINDOW_START
            value: "{{inputs.parameters.window-start}}"
          - name: EATBID_WINDOW_END
            value: "{{inputs.parameters.window-end}}"
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    # 예약 entrypoint다(EAT-254). `retain_until`이 지난 superseded build의 mart 행을 회수한다 — ADR 0034가
    # 허용한 유일한 공개 mart 행 삭제이며 build 원장 행은 남긴다. `eatbid-mart-build` mutex를 잡지 않는
    # 이유: superseded는 종착 상태라 활성화와 같은 행을 다투지 않고, 잡으면 첫 회수(수천만 행)가 그동안
    # 화면의 build 전환을 막는다. 대신 CronWorkflow가 수집이 없는 새벽에 부른다(mart-reap.yaml).
    - name: reap-marts
      outputs:
        parameters:
          - name: reaped-builds
            valueFrom: { path: /tmp/eatbid/reaped_builds }
          - name: deleted-rows
            valueFrom: { path: /tmp/eatbid/deleted_rows }
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid reap-marts
            --as-of "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --result-dir "$EATBID_RESULT_DIR"
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 512Mi
        env:
          - *env-result-dir
          - *env-database-url
          # R2는 쓰지 않지만 프로세스 설정은 명령별이 아니라 다섯이 다 있어야 뜬다(next-backfill-window 주석).
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    # 운영자 entrypoint다. 어떤 DAG에도 들지 않고, 결론 없이 끝난 release를 planned → failed로 닫으며
    # 열린 run을 같은 category로 끝낸다(collection-runbook §4.3). onExit 같은 자동 핸들러로 걸지 않는
    # 이유는 planned가 같은 run으로 이어 갈 수 있는 상태이기 때문이다(EAT-122).
    # 봉인된 release를 남긴 채 멎은 run을 운영자가 닫는다(EAT-234). fail-release가 `planned`만 닫으므로
    # capture까지 성공한 뒤 프로세스가 사라진 run은 여기로 온다. 어떤 DAG도 이 template을 task로 갖지
    # 않는다 — 무엇이 참인지 확인한 사람만 부른다.
    - name: close-stalled-run
      inputs:
        parameters:
          - name: run-id
          - name: outcome
          # failed일 때만 값을 준다. published에 실패 사유를 붙이면 CLI가 거부한다.
          - name: failure-category
            value: ""
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          # 빈 category를 인자로 넘기면 argparse의 choices가 거부하므로 값이 있을 때만 붙인다.
          - >-
            exec eatbid close-stalled-run
            --run-id "$EATBID_RUN_ID"
            --outcome "$EATBID_OUTCOME"
            ${EATBID_FAILURE_CATEGORY:+--failure-category "$EATBID_FAILURE_CATEGORY"}
            --ended-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_RUN_ID
            value: "{{inputs.parameters.run-id}}"
          - name: EATBID_OUTCOME
            value: "{{inputs.parameters.outcome}}"
          - name: EATBID_FAILURE_CATEGORY
            value: "{{inputs.parameters.failure-category}}"
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: fail-release
      inputs:
        parameters:
          - name: source-release-id
          - name: failure-category
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid fail-release
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --failure-category "$EATBID_FAILURE_CATEGORY"
            --failed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --result-dir "$EATBID_RESULT_DIR"
        env:
          - *env-source-release-id
          - name: EATBID_FAILURE_CATEGORY
            value: "{{inputs.parameters.failure-category}}"
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key
