apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-backfill-advance
  namespace: eatbid
spec:
  # 창 하나가 실측 15분이고(2026-09-14, 동시 호출 8) 한 시간이면 넉넉하다. Forbid가 겹침을 막으므로
  # 도는 중에 온 회차는 아무것도 하지 않는다. 주기를 줄이는 것보다 창 하나가 끝나는 시간이 진도를
  # 정한다.
  #
  # 평일 08~11시 정각 회차는 만들지 않는다(2026-10-10, EAT-329). 마감이 오전 9~11시에 몰리고 개찰 결과가
  # 그 뒤로 들어오는 시간에 poll-open이 소스를 혼자 쓰게 한다 — 성수기(2026-09-21) 상세 한 건이 0.65초에서
  # 1.6초로 늘어 회차가 141~193분까지 부풀었다. 주말은 poll-open이 쉬므로 매시 그대로다.
  #
  # 평일 05~19시 회차도 만들지 않는다(2026-10-16, EAT-362). 창 하나가 이제 2만 건 안팎이라 100~265분 걸리고
  # (ingest.run 2026-09-16~10-16), 그 project 단계가 발행 mutex를 쥐는 동안 정시 공고 수집이 기다렸다. 10-14에는
  # 12시 회차가 13:43까지 쥐어 공고 수집이 74분 비었다. 04시 회차는 길어도 08시 앞뒤에 끝난다. 하루 진도는 평일
  # 20창에서 9창으로 준다.
  schedules:
    - "0 0-4,20-23 * * 1-5"
    - "0 * * * 0,6"
  timezone: Asia/Seoul
  # 사람이 창을 고르던 것을 기계로 옮긴다(ADR 0052 결정 4). 승인은 없어지지 않고 범위 선언으로 옮겨
  # 갔다 — workflow-template.yaml의 backfill-floor-date를 미는 커밋이 그 승인이다.
  suspend: false
  # 백필을 둘 돌리지 않는다는 규율이 여기서 manifest로 내려온다. 그전에는 운영이 지키는 약속이었다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    # 실행 시간 상한이다(ADR 0069). 자물쇠 대기도 이 시간에 든다. 2만 건 안팎의 창 하나가 정상으로 100~265분, 경합한 날 655분 걸렸다.
    activeDeadlineSeconds: 43200
    entrypoint: advancing-backfill-pipeline
    # 스케줄 수집보다 낮다. 같은 key를 다투지는 않지만(eatbid-source-backfill vs eatbid-source-live)
    # 노드 자원과 대기 큐에서 사용자가 보는 수집이 먼저다.
    priority: 50
    arguments:
      parameters:
        - name: mode
          value: backfill
