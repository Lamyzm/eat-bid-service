apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-expectation-check
  namespace: eatbid
spec:
  schedules:
    # 15분마다. 사고를 늦게 아는 비용이 알림이 조금 늦는 비용보다 크다. 2026-09-10에는 자물쇠 교착을
    # 두 시간, 노드 사망을 28시간 뒤에 알았다. 정각과 5분은 poll-open·백업이 쓰므로 비켜 둔다.
    - "3,18,33,48 * * * *"
  timezone: Asia/Seoul
  suspend: false
  # 앞 회차가 아직 돌고 있으면 건너뛴다. 겹쳐 돌면 같은 위반을 두 번 열고 상태 파일이 서로를 덮어쓴다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    serviceAccountName: eatbid-dataplane
    entrypoint: check
    podGC:
      strategy: OnPodSuccess
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    templates:
      # 수집 WorkflowTemplate을 참조하지 않는다. 감시가 그 템플릿에 매이면 수집 정지·재개 판단과 얽히고,
      # 수집을 멈춘 동안 감시도 함께 멈춘다. 정지해야 할 때 눈이 먼저 감기면 안 된다(ADR 0046 결정 5).
      - name: check
        container:
          image: eatbid-dataplane
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - exec eatbid check-expectations
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          env:
            - name: EATBID_ENVIRONMENT
              value: prod
            # CI·release 발행 판정의 대상. 공개 저장소라 토큰이 없다 — 봇 토큰을 GitHub 비밀값으로
            # 복제하지 않으려고 물어보는 방향을 밖에서 안으로 잡았다. 값이 비면 그 기대는 평가하지 않는다.
            - name: EATBID_GITHUB_REPOSITORY
              value: Lamyzm/eat-bid-service
            # 읽기만 한다. dataplane 역할은 ingest·core에 쓰기 권한이 있지만 감시 질의는 select뿐이다.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eatbid-database-dataplane
                  key: DATABASE_URL
            - name: R2_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: eatbid-r2
                  key: R2_ENDPOINT_URL
            - name: R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: eatbid-r2
                  key: R2_BUCKET
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: eatbid-r2
                  key: R2_ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: eatbid-r2
                  key: R2_SECRET_ACCESS_KEY
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eatbid-alerting
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: eatbid-alerting
                  key: TELEGRAM_CHAT_ID
            # 클러스터 밖 dead man's switch. 회차가 끝까지 끝난 뒤 한 번 친다(ADR 0046 결정 6, EAT-171).
            # 안에 있는 감시는 기계와 함께 죽으므로 신호가 끊긴 것을 바깥이 알린다. 환경별로 다른 check다.
            - name: EATBID_HEARTBEAT_URL
              valueFrom:
                secretKeyRef:
                  name: eatbid-alerting
                  key: HEARTBEAT_URL
