# 감시가 클러스터 상태를 읽기 위한 권한이다. 노드가 죽거나 Argo Application이 어긋난 것은 DB 질의로
# 잡을 수 없다 — 그 사고들은 DB에 아무 흔적도 남기지 않기 때문이다(2026-09-10 노드 28시간 사망).
#
# 쓰기 동사를 하나도 주지 않는다. 감시는 상태를 고치지 않고 사람에게 말하는 일만 한다. 고치는 권한이
# 있으면 언젠가 자동 복구를 여기에 넣게 되고, 그러면 감시가 감시 대상을 바꾸는 자리가 된다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eatbid-monitoring-read
rules:
  # 노드는 namespace가 없으므로 ClusterRole이어야 한다.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eatbid-monitoring-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eatbid-monitoring-read
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
---
# Application은 argocd namespace에 있고 그 namespace는 이 kustomize가 소유하지 않는다. 그래도 여기에
# 두는 이유는 이 권한이 존재하는 이유가 감시이기 때문이다 — argocd 쪽에 두면 왜 있는지 모르는 권한이 된다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eatbid-monitoring-read-workflows
  namespace: eatbid
rules:
  # cron 회차가 기동 전에 죽으면 ingest.run조차 만들지 못해 DB 질의로는 영영 안 보인다
  # (2026-09-14 전진 cron이 설정 검증에서 exit 64로 매시 실패).
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eatbid-monitoring-read-workflows
  namespace: eatbid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eatbid-monitoring-read-workflows
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
---
# 하루 두 번 상태 보고가 서버·웹이 Ready인지, 몇 번 재시작했는지, DB 볼륨이 얼마인지를 말하려면 이 셋이
# 필요하다(EAT-299). 위반 판정에는 쓰지 않는다 — 보고가 "확인 못 함"으로 남지 않게 하는 읽기다.
# eatbid namespace 안으로만 좁힌다. 실제 디스크 사용량은 kubelet 통계(nodes/proxy)에 있지만 그 권한은 노드의
# 모든 파드에 명령을 보낼 수 있는 넓은 권한이라 주지 않는다. pods 읽기는 파드 spec의 평문 env를 보게 하지만,
# 비밀값은 secretKeyRef라 이름만 보이고 값은 Secret 읽기 권한 없이 풀리지 않는다 — Secret은 여기 없다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eatbid-monitoring-read-workloads
  namespace: eatbid
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eatbid-monitoring-read-workloads
  namespace: eatbid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eatbid-monitoring-read-workloads
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eatbid-monitoring-read-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eatbid-monitoring-read-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eatbid-monitoring-read-applications
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
