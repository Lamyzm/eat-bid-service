# 감시가 클러스터 상태를 읽기 위한 권한이다. 노드가 죽거나 Argo Application이 어긋난 것은 DB 질의로
# 잡을 수 없다 — 그 사고들은 DB에 아무 흔적도 남기지 않기 때문이다(2026-09-10 노드 28시간 사망).
#
# 쓰기 동사를 하나도 주지 않는다. 감시는 상태를 고치지 않고 사람에게 말하는 일만 한다. 고치는 권한이
# 있으면 언젠가 자동 복구를 여기에 넣게 되고, 그러면 감시가 감시 대상을 바꾸는 자리가 된다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eatbid-monitoring-read
rules:
  # 노드는 namespace가 없으므로 ClusterRole이어야 한다.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eatbid-monitoring-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eatbid-monitoring-read
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
---
# Application은 argocd namespace에 있고 그 namespace는 이 kustomize가 소유하지 않는다. 그래도 여기에
# 두는 이유는 이 권한이 존재하는 이유가 감시이기 때문이다 — argocd 쪽에 두면 왜 있는지 모르는 권한이 된다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eatbid-monitoring-read-workflows
  namespace: eatbid
rules:
  # cron 회차가 기동 전에 죽으면 ingest.run조차 만들지 못해 DB 질의로는 영영 안 보인다
  # (2026-09-14 전진 cron이 설정 검증에서 exit 64로 매시 실패).
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eatbid-monitoring-read-workflows
  namespace: eatbid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eatbid-monitoring-read-workflows
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eatbid-monitoring-read-applications
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eatbid-monitoring-read-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eatbid-monitoring-read-applications
subjects:
  - kind: ServiceAccount
    name: eatbid-dataplane
    namespace: eatbid
