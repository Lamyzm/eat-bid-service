apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-replay-advance
  namespace: eatbid
spec:
  schedules:
    # 네 시간마다 25분. 전진(매시 정각)·백업(5분)·감시(3,18,33,48분)·회수(04:30)와 겹치지 않는 자리다.
    # 재처리는 하루 늦어도 되는 일이고 전진과 자원을 다투면 새 창 수집이 늦어진다. 창 하나가 1만 6천
    # 건이라 한 회차가 한 시간을 넘기므로 주기를 좁혀도 진도가 빨라지지 않는다(2026-09-17 실측).
    - "25 */4 * * *"
  timezone: Asia/Seoul
  # 사람이 창마다 YAML을 만들어 제출하던 것을 기계로 옮긴다(EAT-274). 승인은 없어지지 않고 릴리스로
  # 옮겨 갔다 — 파서를 고쳐 배포하는 결정이 곧 "이 창을 다시 시도한다"는 승인이다.
  suspend: false
  # 앞 회차가 아직 돌고 있으면 건너뛴다. 발행 mutex가 어차피 직렬화하므로 겹쳐 띄울 이유가 없다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    entrypoint: advancing-replay-pipeline
    # 전진(50)보다 낮다. 새 창을 채우는 것이 옛 창을 고치는 것보다 먼저다.
    priority: 20
