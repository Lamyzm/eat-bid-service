apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-replay-advance
  namespace: eatbid
spec:
  schedules:
    # 25분. 전진(매시 정각)·백업(5분)·감시(3,18,33,48분)·회수(04:30)와 겹치지 않는 자리다.
    # 재처리는 하루 늦어도 되는 일이고 전진과 자원을 다투면 새 창 수집이 늦어진다. 창 하나가 1만 6천
    # 건이라 한 회차가 한 시간을 넘기므로 주기를 좁혀도 진도가 빨라지지 않는다(2026-09-17 실측).
    #
    # 2026-10-16 낮에 잠시 평일 업무 시간을 비웠다가(EAT-362) 같은 날 저녁 되돌렸다. 재처리는 소스를 부르지 않고,
    # 발행 mutex가 없어져(EAT-366, ADR 0070) 반영 거래가 40분 열려 있어도 정시 공고 수집이 기다리지 않는다(운영 실측,
    # 잠금 대기 0건).
    - "25 */4 * * *"
  timezone: Asia/Seoul
  # 사람이 창마다 YAML을 만들어 제출하던 것을 기계로 옮긴다(EAT-274). 승인은 없어지지 않고 릴리스로
  # 옮겨 갔다 — 파서를 고쳐 배포하는 결정이 곧 "이 창을 다시 시도한다"는 승인이다.
  suspend: false
  # 앞 회차가 아직 돌고 있으면 건너뛴다. 발행 mutex가 어차피 직렬화하므로 겹쳐 띄울 이유가 없다.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    # 실행 시간 상한이다(ADR 0069). 자물쇠 대기도 이 시간에 든다. 다음 예약(4시간 뒤)을 한 번 거르더라도 한 release 전체 재처리가 끝날 시간을 준다.
    activeDeadlineSeconds: 28800
    entrypoint: advancing-replay-pipeline
    # 전진(50)보다 낮다. 새 창을 채우는 것이 옛 창을 고치는 것보다 먼저다.
    priority: 20
