apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: eatbid
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            # 무효화 진입점의 유일한 인증 수단이다. optional을 붙이지 않는 이유는 Secret이 없을 때
            # 파드가 조용히 뜨면 그 표면이 토큰 없이 열린 것처럼 보이기 때문이다. 값이 없으면
            # CreateContainerConfigError로 시끄럽게 멈춘다. 코드도 같은 방향이다 — 토큰 미설정은
            # "인증 없음"이 아니라 500이다(ADR 0036-7).
            - name: EATBID_CACHE_REVALIDATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eatbid-cache-revalidate
                  key: EATBID_CACHE_REVALIDATE_TOKEN
