apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: eatbid
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - name: POSTGRES_USER
              value: null
              valueFrom:
                secretKeyRef:
                  name: eatbid-postgres-bootstrap
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: eatbid-postgres-bootstrap
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: null
              valueFrom:
                secretKeyRef:
                  name: eatbid-postgres-bootstrap
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
