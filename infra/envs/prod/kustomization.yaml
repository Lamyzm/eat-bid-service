# 운영 overlay다. 이 파일의 digest 네 줄은 사람이 쓰지 않는다 — release tag 레인의 promote 단계가
# `infra/update_image_digest.py`로 갱신하고 `deploy/prod`에 밀어 넣는다(ADR 0051 결정 2).
#
# dev overlay의 digest는 main 레인이 따로 갱신하며 두 레인은 서로의 파일을 건드리지 않는다(결정 3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:9e118e72b644d91439714243175d4f9c5101e3eda4f4b0a3c9c6c7dda0dc4058
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:d7ae678ea53f36c319d8624989f7b841399447896c19751de28a2b377d49ecbb
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:4d60d2d92cde31e4ca031b7ff9b1b303db44966163f1f989cb4c78327eeabe9b
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:9d0b6a27bc7f51ec776d77ef41ba9a26a345d17cc2674da3efa0dcfdb3e4f760

patches:
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
  - path: patches/web-secret-env.patch.yaml
  - path: patches/sync-waves.patch.yaml
