apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eatbid-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lamyzm/eat-bid-service
    # dev가 보는 ref도 기계가 소유한 파생 branch다. main에 직접 쓸 수 없는 이유는 prod와 같다 —
    # 서버가 main을 보호하고 GitHub Actions를 우회 주체로 등록할 수 없다(EAT-194 실측).
    #
    # prod와 다른 점은 무엇이 이 ref를 옮기느냐다. prod는 서명된 release 태그, dev는 main 병합이다
    # (ADR 0051 결정 2). 그래서 dev는 몇 분 안에 main을 따라가고 prod는 태그가 날 때만 움직인다.
    targetRevision: deploy/dev
    path: infra/envs/dev
  destination:
    server: https://kubernetes.default.svc
    # namespace가 prod와 같은 `eatbid`인 이유: base의 manifest들이 namespace를 값으로 들고 있고
    # InfisicalSecret의 `secretNamespace`처럼 kustomize가 자동으로 바꾸지 못하는 자리가 섞여 있다.
    # dev와 prod는 같은 클러스터에 함께 올리지 않는다 — dev는 별도 기계다(EAT-130).
    #
    # 그래서 이 Application은 dev 클러스터가 생기기 전까지 어디에도 적용하지 않는다. 지금 값은
    # `kubectl kustomize infra/envs/dev`가 무엇을 내는지 검사가 볼 수 있게 하는 데까지만 쓴다.
    namespace: eatbid
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
