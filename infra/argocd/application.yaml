apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eatbid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lamyzm/eat-bid-service
    targetRevision: main
    path: infra/product
  destination:
    server: https://kubernetes.default.svc
    namespace: eatbid
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
