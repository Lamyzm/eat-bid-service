apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eatbid
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lamyzm/eat-bid-service
    # 운영이 보는 ref는 `main`이 아니라 기계가 소유한 `deploy/prod`다. `main`은 서버가 보호해 pull
    # request만 받으므로 릴리스 workflow가 digest를 거기 직접 쓸 수 없고, GITHUB_TOKEN으로 만든 pull
    # request는 required check를 띄우지 않아 자동 병합이 영원히 멈춘다(ADR 0050·0051, EAT-202).
    #
    # 덤으로 `main`의 manifest를 고쳐도 운영이 즉시 움직이지 않는다. 운영은 릴리스 태그가
    # `deploy/prod`를 옮길 때만 바뀐다.
    targetRevision: deploy/prod
    path: infra/envs/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: eatbid
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true"]
