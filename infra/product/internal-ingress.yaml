# `/internal/**`는 클러스터 안에서만 부르는 표면이다. base Ingress의 `/` catch-all이 web을 가리키므로
# Cloudflare Tunnel을 통해 밖에서도 도달할 수 있고, 토큰 한 겹만으로 두지 않는다(ADR 0036-7).
#
# ipAllowList의 판정 대상을 `X-Forwarded-For`의 원 클라이언트 IP로 바꾸는 것이 이 규칙의 핵심이다.
# cloudflared가 클러스터 안에서 돌기 때문에 remote address는 언제나 pod IP(10.42.0.0/16)이고, 그
# 상태로 pod CIDR을 허용하면 터널을 통과한 외부 요청이 전부 통과한다. depth 1은 cloudflared가 실은
# 원 클라이언트 공인 IP를 보게 하므로 밖에서 온 요청은 항상 403이고, `X-Forwarded-For`가 없는 직접
# 요청도 (depth를 채우지 못해) 403이다.
#
# 정상 호출자인 dataplane은 Service ClusterIP(`http://web`)로 직접 붙어 Traefik을 지나지 않는다.
# 그래서 이 목록은 실질적으로 "밖에서는 못 들어온다"를 뜻하며, 두 CIDR은 이 클러스터의 pod 망과
# 노드 망(172.30.0.10)이라 규칙의 의도를 그대로 읽을 수 있게 남긴다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-allowlist
  namespace: eatbid
spec:
  ipAllowList:
    sourceRange:
      - 10.42.0.0/16
      - 172.30.0.0/24
    ipStrategy:
      depth: 1
---
# Traefik은 rule 길이로 우선순위를 정하므로 `/internal`이 base Ingress의 `/`보다 먼저 잡힌다.
# backend가 같은 web Service인 것은 의도다 — 이 Ingress는 경로를 옮기는 것이 아니라 middleware를
# 붙이기 위해 존재한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-internal
  namespace: eatbid
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: eatbid-internal-allowlist@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /internal
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
