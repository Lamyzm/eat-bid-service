apiVersion: batch/v1
kind: Job
metadata:
  name: eatbid-migration
  namespace: eatbid
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: eatbid-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: eatbid-migration
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eatbid-database-migrator
                  key: DATABASE_URL
