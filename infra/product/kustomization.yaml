apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:ebaa91272e81ef4ac2960cec3b4427dfdf0193d3bd00094f577df198958c5d62
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:984ed69e07d09dc6768f8caf863a1593c1bc2033d3c122f4b2caf12f6d3f9e54
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:bd292d1ce3d0892d5023f0cd6158e6fb54b43cc12db0fb9a859ec2b5f7b4bd83
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:a832295aeae6dfa8f64bf2d5ad1083e8b1c67b6abe9cdd15f6e997c4ff074fa2

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
