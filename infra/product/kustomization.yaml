apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:40ed2ce72668e6b1a09208b745e427f66716a5c5989d10a25d0b1569adf4f9ce
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:5fd90127d412182cd17403edf0c5505618b15dca4ed5073cac5554d5c48d7b05
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:6db5d22c0840727e069651331bdc88ea098129e37f8b53e605ce2d8863612861
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:710fe30c83ad297685f789061a7a99a2329208dad805ffeea6f57b5cc2fb5b35

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
