apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:8327e58077c4cf1324c37da6be5cf258c44ab85068da1770beeaab9ac7899e92
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:c5ac8d9e70dbd21e7e128ab0b3050a3018d98a4c3fb6896246ca1bc9f1ee785b
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:629f51e568260bc7ceec2659b00e96cdcb843d0c8c0fb52b832e9a46da85d4a2
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:2e32c89c481a2da1e4ebea33324ec4811a0c656561a68161564c92a62b41d98c

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
