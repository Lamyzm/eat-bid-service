apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:3af67be9d1e813e46519fdb10ae679b9af7f8e954f0bdffd510f6aa7765ca825
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:ec0df374613d7577e70cbaba6dd5d0f55a88b49b79346a4c3c9b6ce311be9293
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:a411dd1ee6b0a8eea8d0630fe6a0d70a049db9d6d0c9d9078b65d89dd7ccdad3
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:48c511753de5f11e388017ba1faeda0e08fc48d1390c4a5d01b924e1fe0cbd0c

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
  - path: patches/sync-waves.patch.yaml
