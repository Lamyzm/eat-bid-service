apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:17dcc9d51060d5e34df3f0e968ac62a5761fa3c77628deaf994c0cfd6d372005
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:add9c912df0f322f6b2491028598908f644b6451823b7942353ce2f74966123c
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:b01ef4311d03f087ce900fdc5949605d15c956cb1c3fd08517174948c12b8877
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:e5fd7b93eba1fb1f0d9ab642759a34437bb1670d728857fae28d951f4dafbe73

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
