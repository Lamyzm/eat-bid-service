apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:fadeb324cbc911d899a545373c9b3142a87251bf5ed845dfdcdf0a03227f9036
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:3f2676416e2cfe66ac6cd5891da549cf1b25242e9076fb9a5416cf727e4f1b0e
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:69db64bc96caa5312ea2492455b82e145c2e44082e7732306c6a217b9b8999c0
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:fd3fb626b825b349f811c4df0836ca18f354dc05b9615a7624a49d9f862f4eac

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
