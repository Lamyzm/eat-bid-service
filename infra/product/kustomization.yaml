apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - db-provisioning.yaml
  - secrets.yaml
  - internal-ingress.yaml
  - workflows

# SQL을 ConfigMap에 손으로 옮겨 적으면 저장소와 클러스터의 권한 집합이 갈라진다. generator가 파일을
# 그대로 실어 이름 접미사 해시로 내용까지 고정하므로, SQL이 바뀌면 hook Job의 pod spec도 함께 바뀐다.
configMapGenerator:
  - name: eatbid-db-provisioning
    namespace: eatbid
    files:
      - db-provisioning.sql

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:10cecf19bafe14c2d41b6ddbd793376b82b51d9f124545e89b28c7fa99453da8
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:9f46e15df3b2b487e6dc9e6e3b72b5e506bd42938a1f0d76552a226aa76479b5
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:d648535dc67150208d8d8902825c24ba4b3b51132a15ead9639ff25264672388
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:646d929f3d008d2a3c96ad3c240bfbef96892ab35f0203f2a03d1ee6450f1892

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
  - path: patches/web-secret-env.patch.yaml
  - path: patches/sync-waves.patch.yaml
