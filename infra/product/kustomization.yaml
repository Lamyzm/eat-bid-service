apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:7dc54788ff69873c768590726d030f2943686be9c8ea28e6281bdd1a854d52e4
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:97df03e4092903ca023065eaf8fba7113d7c5a5a9390427c103958032c5b0f37
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:91741e7462c497517e305a70dc17811b60c4f0a19435dadaaa44ac0447b590df
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:d39f08f043f38c59929cda70d0faecd651e6a8e6c314e46f9915b5ef3fd73dfd

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
