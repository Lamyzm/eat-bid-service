# 옮겨 가는 동안만 남는 별칭이다. `infra/envs/prod`와 글자 하나까지 같은 것을 렌더한다.
#
# 왜 필요한가: Argo CD Application이 `deploy/prod` 브랜치의 이 경로를 보고 있고 syncPolicy가
# `prune: true`다. 경로를 한 번에 옮기면 어느 쪽으로 해도 사고가 난다. Application을 먼저 바꾸면 그
# 경로가 `deploy/prod`에 아직 없고, 릴리스를 먼저 내면 이 경로가 사라진다. 둘 다 Argo가 "선언된 것이
# 없다"로 읽어 prune이 운영 리소스를 지운다.
#
# 그래서 전환 릴리스는 두 경로를 모두 싣는다. 둘이 같은 것을 렌더하므로 Application의 path를 언제
# 바꿔도 diff가 0이고 prune이 돌지 않는다. 바꾼 뒤 이 파일을 지운다 — 그 삭제가 전환의 마지막 단계다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../envs/prod
