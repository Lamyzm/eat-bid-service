apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - secrets.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:1fd59e448e8069c04027141370b5ac2932b3029a322c6207c06c8a104c5f2258
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:e15a1dcd74d6f4284c859c6dc71c28962dfc0d13e47dacb30fc5020b702ba0aa
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:b5660d66b10d940de7f6f2657c473c057fe96f819830e3a35f4f9a4ac81a427b
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:17b7db947dd0f42fa91a996ad94800ddea687a3e0da9269bb4f2a612c5cb1b68

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
