apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configurations:
  - kustomizeconfig.yaml

resources:
  - ../k8s/base
  - migration.yaml
  - workflows

images:
  - name: eatbid-web
    newName: ghcr.io/lamyzm/eatbid-web
    digest: sha256:211771301298248346b493d98759881c9f7ff1bbc437d29a84a4b4614168935e
  - name: eatbid-server
    newName: ghcr.io/lamyzm/eatbid-server
    digest: sha256:ccf3ac73539a3025a806a886c646e5dab05ceab542e69472ba2c46e85d83e598
  - name: eatbid-dataplane
    newName: ghcr.io/lamyzm/eatbid-dataplane
    digest: sha256:a35d48fa3d4e0440b60678cd884f18e218d603a781bd75a47bf6671d265e59b6
  - name: eatbid-migration
    newName: ghcr.io/lamyzm/eatbid-migration
    digest: sha256:3418095c60d6f66b007eda9f54a6ed805bb260a3a8c5477f8a52bdcd0168fe45

patches:
  - path: patches/legacy-cronjobs.delete.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
      name: daily-refresh|poll-open-day|poll-open-off|poll-open-weekend
  - path: patches/postgres-secret-env.patch.yaml
  - path: patches/server-secret-env.patch.yaml
