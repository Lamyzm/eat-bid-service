apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: eatbid
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: DATABASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: eatbid-database-api
                  key: DATABASE_URL
            # 서버 환경 검증은 production에서 CORS_ORIGINS를 필수로 요구한다(apps/server platform/config/environment.ts).
            # 브라우저가 API를 부르는 공개 origin은 Cloudflare 터널 뒤의 zone apex(eatbid.net) 하나뿐이다.
            - name: CORS_ORIGINS
              value: "https://eatbid.net"
