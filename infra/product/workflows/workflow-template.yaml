apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: eatbid-dataplane
  namespace: eatbid
spec:
  entrypoint: scheduled-pipeline
  serviceAccountName: eatbid-dataplane
  # fan-out 폭을 단일 노드 용량 아래로 묶는다. 2026-09-05 첫 backfill은 normalize 131개를 한꺼번에
  # 띄워 kubelet pod 상한(110)을 넘기고 postgres readiness까지 지연시켜 22건이 DB 연결 시간 초과로
  # 죽었다. capture는 source semaphore로 이미 직렬이므로 이 값은 사실상 normalize 동시성이다.
  parallelism: 4
  arguments:
    parameters:
      # mode는 CLI `discover --mode`로 그대로 전달되고 날짜 창은 CLI가 번역한다. poll-open과
      # daily-reconcile은 start-date/end-date를 비워 두어야 하며, backfill submit만 두 날짜를 채운다.
      #   argo submit --from workflowtemplate/eatbid-dataplane -n eatbid \
      #     -p mode=backfill -p start-date=20250901 -p end-date=20251130
      - name: mode
        value: poll-open
      # eat-v2가 기본값인 이유는 상세 응답의 명단·낙찰·재공고 블록을 읽는 유일한 version이기
      # 때문이다. EAT-43이 `auction.v2`를 발행 가능 record type에 넣기 전에는 v1이 기본값이었고,
      # 2026-09-06 실측에서 그 v1 발행 385 revision은 전부 하한율이 없고 투찰·낙찰·업체가 비어 있었다.
      # v1으로 이미 봉인된 발행물은 그대로 두고 같은 공고가 v2로 다시 관측되면 새 revision이 생긴다.
      - name: parser-version
        value: eat-v2
      # mart 계산 규칙의 version이다. parser-version과 같은 자리에 두는 이유는 둘 다 "이 실행이 어떤
      # 해석 규칙으로 만든 결과인가"를 기록하는 값이고, 규칙을 바꾼 배포가 옛 build를 조용히 덮어쓰지
      # 않으려면 새 값으로 새 build를 만들어야 하기 때문이다(ADR 0034).
      # mart-r2는 열린 공고 스냅샷이 최신 상세 해석의 하한율·품목·지역·기관 라벨을 함께 싣는
      # 계산 규칙이다(EAT-68). mart-r3는 예정가격이 0으로 관측된(추첨 전) 회차의 그날 하한·투찰률 축
      # 낙찰률·하한 미만 수를 0이 아니라 null로 두는 규칙이다(EAT-74). 옛 build를 덮어쓰지 않고
      # 새 build로 만들어 전환한다.
      - name: calc-version
        value: mart-r3
      - name: start-date
        value: ""
      - name: end-date
        value: ""
      - name: release-name
        value: ""
  templates:
    - name: scheduled-pipeline
      dag:
        tasks:
          - name: discover
            template: discover
          - name: capture
            template: capture
            dependencies: [discover]
            # chunk 하나가 상세 pod 하나다. 건당 pod를 띄우면 건당 약 17초 중 10초가 pod 생성·종료
            # 비용이라 한 달 백필이 80시간이 된다(EAT-51 증거 §6). CLI가 chunk를 순차로 관측하므로
            # 건별 raw 저장·request unit grain은 그대로고 pod 수만 줄어든다.
            withParam: "{{tasks.discover.outputs.parameters.external-bid-id-chunks}}"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: external-bid-ids-json
                  value: "{{item}}"
          - name: normalize
            template: normalize
            dependencies: [capture]
            # 확장된 capture의 output parameter `observation-ids`가 chunk마다 하나씩 모인다. capture가
            # 묶은 그 단위를 그대로 이어받아 정규화도 pod 하나가 chunk 하나를 돈다.
            withParam: "{{tasks.capture.outputs.parameters.observation-ids}}"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: observation-ids-json
                  value: "{{item}}"
          - name: validate
            template: validate
            dependencies: [normalize]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"
          - name: project
            template: project
            dependencies: [validate]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"
          - name: marts
            template: marts
            dependencies: [project]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"

    # 정부 코드 reference 적재다. eaT 수집과 같은 template·이미지·serviceaccount로 돌지만 발견도
    # fan-out도 없다. 파일 하나가 곧 관측 하나이고 release 하나여서 단계가 둘뿐이다(ADR 0035).
    # 별도 CronJob이나 스케줄러를 만들지 않는다(AGENTS 9).
    - name: reference-pipeline
      inputs:
        parameters:
          # source·dataset의 요청 모양과 컬럼 계약은 검토된 source 계약이 갖는다. 여기서는 어느
          # 계약을 실행할지의 이름만 고른다.
          - name: reference-source
            value: mois-standard-code
          - name: reference-dataset
            value: legal-dong
          # 정부 파일 파서의 version이다. eaT parser-version과 별개인 이유는 두 소스의 해석 규칙이
          # 서로 무관하게 움직이기 때문이다.
          - name: reference-parser-version
            value: mois-v1
      dag:
        tasks:
          - name: capture-reference
            template: capture-reference
            arguments:
              parameters:
                - name: reference-source
                  value: "{{inputs.parameters.reference-source}}"
                - name: reference-dataset
                  value: "{{inputs.parameters.reference-dataset}}"
                - name: reference-parser-version
                  value: "{{inputs.parameters.reference-parser-version}}"
          - name: project-reference
            template: project-reference
            dependencies: [capture-reference]
            arguments:
              parameters:
                - name: reference-source
                  value: "{{inputs.parameters.reference-source}}"
                - name: reference-dataset
                  value: "{{inputs.parameters.reference-dataset}}"
                - name: reference-parser-version
                  value: "{{inputs.parameters.reference-parser-version}}"
                - name: source-release-id
                  value: "{{tasks.capture-reference.outputs.parameters.source-release-id}}"
                - name: observation-id
                  value: "{{tasks.capture-reference.outputs.parameters.observation-id}}"
                # 수집이 쓴 release 이름을 그대로 받는다. 두 단계가 각자 이름을 지으면 같은 실행에서
                # 다른 release를 가리킨다.
                - name: release-name
                  value: "{{tasks.capture-reference.outputs.parameters.release-name}}"

    # replay는 ad hoc 실행이지만 core를 다시 앉힌 뒤 mart를 다시 만들지 않으면 화면이 옛 build를
    # 계속 읽는다. replay 전용 DAG를 따로 두어 예약 실행과 같은 marts task를 잇는다.
    - name: replay-pipeline
      inputs:
        parameters:
          - name: source-release-id
          - name: publication-id
          - name: observation-ids-json
          - name: started-at
          - name: normalized-at
          - name: validated-at
          - name: activated-at
      dag:
        tasks:
          - name: replay
            template: replay
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{inputs.parameters.source-release-id}}"
                - name: publication-id
                  value: "{{inputs.parameters.publication-id}}"
                - name: observation-ids-json
                  value: "{{inputs.parameters.observation-ids-json}}"
                - name: started-at
                  value: "{{inputs.parameters.started-at}}"
                - name: normalized-at
                  value: "{{inputs.parameters.normalized-at}}"
                - name: validated-at
                  value: "{{inputs.parameters.validated-at}}"
                - name: activated-at
                  value: "{{inputs.parameters.activated-at}}"
          - name: marts
            template: marts
            dependencies: [replay]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{inputs.parameters.source-release-id}}"
                # replay는 discovery 없이 workflow uid 하나로 돌므로 run 정체성이 그것뿐이다.
                - name: detail-run-id
                  value: "{{workflow.uid}}"
                - name: publication-id
                  value: "{{inputs.parameters.publication-id}}"

    - name: discover
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-limit
      outputs:
        parameters:
          # CLI `--result-dir`가 machine result의 key마다 남긴 파일이다. 뒤 단계는 이 값만 받는다.
          - name: source-release-id
            valueFrom:
              path: /tmp/eatbid/source_release_id
          - name: detail-run-id
            valueFrom:
              path: /tmp/eatbid/detail_run_id
          - name: publication-id
            valueFrom:
              path: /tmp/eatbid/publication_id
          # capture fan-out 단위다. 평평한 `external_bid_ids`도 같은 디렉터리에 남지만 output
          # parameter로 내보내지 않는다. 피크 월 17,000건이면 그 목록만으로 workflow status가
          # 수백 KB 늘어나는데 아무 단계도 그것을 읽지 않는다.
          - name: external-bid-id-chunks
            valueFrom:
              path: /tmp/eatbid/external_bid_id_chunks
          - name: discovered-count
            valueFrom:
              path: /tmp/eatbid/discovered_count
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import os
            import sys
            import uuid

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                run_id = uuid.UUID(os.environ["EATBID_RUN_ID"])
            except (KeyError, ValueError):
                fail("EATBID_RUN_ID must be the workflow UUID")
            mode = os.environ.get("EATBID_WORKFLOW_MODE", "")
            created_at = os.environ.get("EATBID_WORKFLOW_CREATED_AT", "")
            result_dir = os.environ.get("EATBID_RESULT_DIR", "")
            if not mode or not created_at or not result_dir:
                fail("EATBID_WORKFLOW_MODE, EATBID_WORKFLOW_CREATED_AT, EATBID_RESULT_DIR are required")

            # 한 workflow의 release, detail run, publication 정체성은 workflow uid에서 결정적으로
            # 파생한다. 같은 pod가 다시 뜨면 새 정체성을 만들어 고아 run을 남기는 대신 같은 정체성으로
            # 충돌해 멈춘다. discovery run 자체는 workflow uid 그대로다.
            source_release_id = uuid.uuid5(run_id, "eatbid:source-release")
            detail_run_id = uuid.uuid5(run_id, "eatbid:detail-run")
            publication_id = uuid.uuid5(run_id, "eatbid:publication")
            release_name = os.environ.get("EATBID_RELEASE_NAME") or f"{mode} {created_at} {run_id}"

            os.makedirs(result_dir, exist_ok=True)
            with open(os.path.join(result_dir, "publication_id"), "w", encoding="utf-8") as handle:
                handle.write(str(publication_id))

            argv = [
                "eatbid", "discover",
                "--mode", mode,
                "--run-id", str(run_id),
                "--source-release-id", str(source_release_id),
                "--detail-run-id", str(detail_run_id),
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_PARSER_VERSION"],
                "--release-name", release_name,
                "--as-of", created_at,
                "--started-at", created_at,
                "--completed-at", created_at,
                "--start-date", os.environ.get("EATBID_START_DATE", ""),
                "--end-date", os.environ.get("EATBID_END_DATE", ""),
                # 월 창 TOT_CNT 약 17,000이 SOURCE_PAGE_BUDGET(기본 100) 안에 들려면 CLI 기본 100이
                # 아니라 계약 상한 page size로 불러야 한다.
                "--page-size", os.environ["EATBID_DISCOVER_PAGE_SIZE"],
                "--result-dir", result_dir,
            ]
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - &env-run-id
            name: EATBID_RUN_ID
            value: "{{workflow.uid}}"
          - &env-parser-version
            name: EATBID_PARSER_VERSION
            value: "{{workflow.parameters.parser-version}}"
          - &env-created-at
            name: EATBID_WORKFLOW_CREATED_AT
            value: "{{workflow.creationTimestamp}}"
          - &env-result-dir
            name: EATBID_RESULT_DIR
            value: /tmp/eatbid
          - name: EATBID_START_DATE
            value: "{{workflow.parameters.start-date}}"
          - name: EATBID_END_DATE
            value: "{{workflow.parameters.end-date}}"
          - name: EATBID_RELEASE_NAME
            value: "{{workflow.parameters.release-name}}"
          - name: EATBID_DISCOVER_PAGE_SIZE
            value: "1000"
          - &env-database-url
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: eatbid-database-dataplane
                key: DATABASE_URL
          - &env-r2-endpoint
            name: R2_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_ENDPOINT_URL
          - &env-r2-bucket
            name: R2_BUCKET
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_BUCKET
          - &env-r2-access-key
            name: R2_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_ACCESS_KEY_ID
          - &env-r2-secret-key
            name: R2_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_SECRET_ACCESS_KEY

    - name: capture
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: external-bid-ids-json
      synchronization:
        semaphores:
          # semaphore는 chunk pod 단위로 잡힌다. chunk가 커져도 소스 동시 호출은 여전히 capacity를
          # 넘지 않는다.
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-limit
      outputs:
        parameters:
          - name: observation-ids
            valueFrom:
              path: /tmp/eatbid/observation_ids
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          # chunk는 JSON 배열 하나로 argv 한 칸에 들어간다. shell이 그 문자열을 쪼개거나 확장하지
          # 못하게 큰따옴표 안에서만 펼치고, 모양 검사는 CLI 인자 단계가 fail-closed로 한다.
          - >-
            exec eatbid capture --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --external-bid-ids-json "$EATBID_EXTERNAL_BID_IDS_JSON"
            --started-at "$EATBID_WORKFLOW_CREATED_AT"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - &env-source-release-id
            name: EATBID_SOURCE_RELEASE_ID
            value: "{{inputs.parameters.source-release-id}}"
          - &env-detail-run-id
            name: EATBID_DETAIL_RUN_ID
            value: "{{inputs.parameters.detail-run-id}}"
          - name: EATBID_EXTERNAL_BID_IDS_JSON
            value: "{{inputs.parameters.external-bid-ids-json}}"
          - *env-parser-version
          - *env-created-at
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: normalize
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: observation-ids-json
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid normalize --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --observation-ids-json "$EATBID_OBSERVATION_IDS_JSON"
            --normalized-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - name: EATBID_OBSERVATION_IDS_JSON
            value: "{{inputs.parameters.observation-ids-json}}"
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: validate
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid validate --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --validated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - &env-publication-id
            name: EATBID_PUBLICATION_ID
            value: "{{inputs.parameters.publication-id}}"
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: project
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      synchronization:
        mutexes:
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid project --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --activated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - *env-publication-id
          - *env-parser-version
          - &env-web-internal-url
            # web ClusterIP Service다. 터널·Ingress를 지나지 않으므로 `/internal` ipAllowList 규칙의
            # 판정 대상이 아니고, 이 값이 비면 무효화를 건너뛴다(발행은 실패시키지 않는다).
            name: EATBID_WEB_INTERNAL_URL
            value: http://web
          - &env-cache-revalidate-token
            name: EATBID_CACHE_REVALIDATE_TOKEN
            valueFrom:
              secretKeyRef:
                name: eatbid-database-dataplane
                key: EATBID_CACHE_REVALIDATE_TOKEN
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: marts
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      synchronization:
        mutexes:
          # core 발행과 다른 mutex를 쓴다. 같은 mutex면 mart 빌드가 다음 수집의 발행을 막아 소스
          # 관측이 늦어진다. mart는 파생물이라 stale이 정상 상태다(ADR 0011·0034).
          - name: eatbid-mart-build
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          # --mart를 주지 않는다. 어느 mart가 이 발행의 영향 범위인지는 CLI가 발행이 실은 record
          # type으로 고르며, 그 판단이 여기와 코드 두 곳에 살면 갈라진다.
          # --region-scheme도 주지 않는다. 지역 코드 체계의 권위는 code scheme 표 하나뿐이고
          # 체계를 바꾸는 것은 새 calc-version의 배포 결정이다(AGENTS 6).
          - >-
            exec eatbid build-marts --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --calc-version "$EATBID_MART_CALC_VERSION"
            --as-of "$EATBID_WORKFLOW_CREATED_AT"
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - *env-publication-id
          - name: EATBID_MART_CALC_VERSION
            value: "{{workflow.parameters.calc-version}}"
          - *env-parser-version
          - *env-created-at
          - *env-result-dir
          - *env-web-internal-url
          - *env-cache-revalidate-token
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: capture-reference
      inputs:
        parameters:
          - name: reference-source
          - name: reference-dataset
          - name: reference-parser-version
      synchronization:
        semaphores:
          # eaT 수집과 같은 semaphore를 쓴다. 소스는 다르지만 이 클러스터가 밖으로 내는 동시 호출의
          # 상한은 하나여야 운영이 그 값을 한 곳에서 본다.
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-limit
      outputs:
        parameters:
          - name: source-release-id
            valueFrom:
              path: /tmp/eatbid/source_release_id
          - name: observation-id
            valueFrom:
              path: /tmp/eatbid/observation_id
          - name: release-name
            valueFrom:
              path: /tmp/eatbid/release_name
          - name: member-count
            valueFrom:
              path: /tmp/eatbid/member_count
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import os
            import sys
            import uuid

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                run_id = uuid.UUID(os.environ["EATBID_RUN_ID"])
            except (KeyError, ValueError):
                fail("EATBID_RUN_ID must be the workflow UUID")
            created_at = os.environ.get("EATBID_WORKFLOW_CREATED_AT", "")
            source = os.environ.get("EATBID_REFERENCE_SOURCE", "")
            dataset = os.environ.get("EATBID_REFERENCE_DATASET", "")
            if not created_at or not source or not dataset:
                fail("EATBID_WORKFLOW_CREATED_AT, EATBID_REFERENCE_SOURCE, EATBID_REFERENCE_DATASET are required")

            # release 정체성은 workflow uid에서 결정적으로 파생한다. 같은 pod가 다시 뜨면 새 정체성을
            # 만들어 고아 release를 남기는 대신 같은 정체성으로 충돌해 멈춘다.
            source_release_id = uuid.uuid5(run_id, "eatbid:reference-release")
            release_name = os.environ.get("EATBID_RELEASE_NAME") or f"{dataset} {created_at} {run_id}"

            argv = [
                "eatbid", "capture-reference",
                "--run-id", str(run_id),
                "--source-release-id", str(source_release_id),
                "--source", source,
                "--dataset", dataset,
                "--release-name", release_name,
                "--as-of", created_at,
                "--started-at", created_at,
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_REFERENCE_PARSER_VERSION"],
                "--result-dir", os.environ["EATBID_RESULT_DIR"],
            ]
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: reference
          - *env-run-id
          - &env-reference-source
            name: EATBID_REFERENCE_SOURCE
            value: "{{inputs.parameters.reference-source}}"
          - &env-reference-dataset
            name: EATBID_REFERENCE_DATASET
            value: "{{inputs.parameters.reference-dataset}}"
          - &env-reference-parser-version
            name: EATBID_REFERENCE_PARSER_VERSION
            value: "{{inputs.parameters.reference-parser-version}}"
          - *env-created-at
          - *env-result-dir
          - name: EATBID_RELEASE_NAME
            value: "{{workflow.parameters.release-name}}"
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: project-reference
      inputs:
        parameters:
          - name: reference-source
          - name: reference-dataset
          - name: reference-parser-version
          - name: source-release-id
          - name: observation-id
          - name: release-name
      synchronization:
        mutexes:
          # core 발행과 같은 mutex다. 코드 한 벌을 앉히는 동안 공고 투영이 같은 code_value를 만들면
          # 두 실행이 같은 행을 두고 다툰다.
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid project-reference --run-id "$EATBID_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --source "$EATBID_REFERENCE_SOURCE"
            --dataset "$EATBID_REFERENCE_DATASET"
            --observation-id "$EATBID_OBSERVATION_ID"
            --release-name "$EATBID_RELEASE_NAME"
            --projected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA"
            --parser-version "$EATBID_REFERENCE_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: reference
          - *env-run-id
          - *env-source-release-id
          - *env-reference-source
          - *env-reference-dataset
          - *env-reference-parser-version
          - name: EATBID_OBSERVATION_ID
            value: "{{inputs.parameters.observation-id}}"
          - name: EATBID_RELEASE_NAME
            value: "{{inputs.parameters.release-name}}"
          - *env-created-at
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: replay
      inputs:
        parameters:
          - name: source-release-id
          - name: publication-id
          - name: observation-ids-json
          - name: started-at
          - name: normalized-at
          - name: validated-at
          - name: activated-at
      synchronization:
        mutexes:
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import json
            import os
            import sys

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                observation_ids = json.loads(os.environ["EATBID_OBSERVATION_IDS_JSON"])
            except (KeyError, json.JSONDecodeError):
                fail("observation-ids-json must be a JSON array")
            if not isinstance(observation_ids, list) or not observation_ids:
                fail("observation-ids-json must be a non-empty JSON array")
            if any(
                type(value) is not int
                or value <= 0
                or value > 9_223_372_036_854_775_807
                for value in observation_ids
            ):
                fail("every observation ID must be a positive bigint")
            if len(set(observation_ids)) != len(observation_ids):
                fail("observation IDs must be unique")

            argv = [
                "eatbid", "replay",
                "--run-id", os.environ["EATBID_RUN_ID"],
                "--source-release-id", os.environ["EATBID_SOURCE_RELEASE_ID"],
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_PARSER_VERSION"],
                "--publication-id", os.environ["EATBID_PUBLICATION_ID"],
            ]
            for observation_id in observation_ids:
                argv.extend(("--observation-id", str(observation_id)))
            argv.extend((
                "--started-at", os.environ["EATBID_STARTED_AT"],
                "--normalized-at", os.environ["EATBID_NORMALIZED_AT"],
                "--validated-at", os.environ["EATBID_VALIDATED_AT"],
                "--activated-at", os.environ["EATBID_ACTIVATED_AT"],
            ))
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: replay
          - *env-run-id
          - *env-parser-version
          - *env-source-release-id
          - *env-publication-id
          - name: EATBID_OBSERVATION_IDS_JSON
            value: "{{inputs.parameters.observation-ids-json}}"
          - name: EATBID_STARTED_AT
            value: "{{inputs.parameters.started-at}}"
          - name: EATBID_NORMALIZED_AT
            value: "{{inputs.parameters.normalized-at}}"
          - name: EATBID_VALIDATED_AT
            value: "{{inputs.parameters.validated-at}}"
          - name: EATBID_ACTIVATED_AT
            value: "{{inputs.parameters.activated-at}}"
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key
