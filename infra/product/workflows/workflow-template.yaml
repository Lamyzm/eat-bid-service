apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: eatbid-dataplane
  namespace: eatbid
spec:
  entrypoint: scheduled-pipeline
  serviceAccountName: eatbid-dataplane
  # fan-out 폭을 단일 노드 용량 아래로 묶는다. 2026-09-05 첫 backfill은 normalize 131개를 한꺼번에
  # 띄워 kubelet pod 상한(110)을 넘기고 postgres readiness까지 지연시켜 22건이 DB 연결 시간 초과로
  # 죽었다. capture는 source semaphore로 이미 직렬이므로 이 값은 사실상 normalize 동시성이다.
  parallelism: 4
  arguments:
    parameters:
      # mode는 CLI `discover --mode`로 그대로 전달되고 날짜 창은 CLI가 번역한다. poll-open과
      # daily-reconcile은 start-date/end-date를 비워 두어야 하며, backfill submit만 두 날짜를 채운다.
      #   argo submit --from workflowtemplate/eatbid-dataplane -n eatbid \
      #     -p mode=backfill -p start-date=20250901 -p end-date=20251130
      - name: mode
        value: poll-open
      # eat-v2는 EAT-43 전까지 발행 경로가 아니다 — capture와 normalize는 성공하고 projection에서
      # typed 실패(`ProjectionContractError`)로 멈추므로 그때까지 쓴 크롤 예산은 회수되지 않는다.
      - name: parser-version
        value: eat-v1
      # mart 계산 규칙의 version이다. parser-version과 같은 자리에 두는 이유는 둘 다 "이 실행이 어떤
      # 해석 규칙으로 만든 결과인가"를 기록하는 값이고, 규칙을 바꾼 배포가 옛 build를 조용히 덮어쓰지
      # 않으려면 새 값으로 새 build를 만들어야 하기 때문이다(ADR 0034).
      - name: calc-version
        value: mart-r1
      - name: start-date
        value: ""
      - name: end-date
        value: ""
      - name: release-name
        value: ""
  templates:
    - name: scheduled-pipeline
      dag:
        tasks:
          - name: discover
            template: discover
          - name: capture
            template: capture
            dependencies: [discover]
            # 발견된 ID마다 상세 pod 하나다. source semaphore가 capture template에 걸려 있어 fan-out
            # 폭과 무관하게 소스 동시 호출은 capacity를 넘지 않는다.
            withParam: "{{tasks.discover.outputs.parameters.external-bid-ids}}"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: external-bid-id
                  value: "{{item}}"
          - name: normalize
            template: normalize
            dependencies: [capture]
            # 확장된 capture의 output parameter `observation-id`가 JSON 배열로 모인다. stdout 결과가
            # 아니라 파일 output parameter를 쓰므로 값이 문자열 JSON이 아닌 item 그대로 도착한다.
            withParam: "{{tasks.capture.outputs.parameters.observation-id}}"
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: observation-id
                  value: "{{item}}"
          - name: validate
            template: validate
            dependencies: [normalize]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"
          - name: project
            template: project
            dependencies: [validate]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"
          - name: marts
            template: marts
            dependencies: [project]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{tasks.discover.outputs.parameters.source-release-id}}"
                - name: detail-run-id
                  value: "{{tasks.discover.outputs.parameters.detail-run-id}}"
                - name: publication-id
                  value: "{{tasks.discover.outputs.parameters.publication-id}}"

    # replay는 ad hoc 실행이지만 core를 다시 앉힌 뒤 mart를 다시 만들지 않으면 화면이 옛 build를
    # 계속 읽는다. replay 전용 DAG를 따로 두어 예약 실행과 같은 marts task를 잇는다.
    - name: replay-pipeline
      inputs:
        parameters:
          - name: source-release-id
          - name: publication-id
          - name: observation-ids-json
          - name: started-at
          - name: normalized-at
          - name: validated-at
          - name: activated-at
      dag:
        tasks:
          - name: replay
            template: replay
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{inputs.parameters.source-release-id}}"
                - name: publication-id
                  value: "{{inputs.parameters.publication-id}}"
                - name: observation-ids-json
                  value: "{{inputs.parameters.observation-ids-json}}"
                - name: started-at
                  value: "{{inputs.parameters.started-at}}"
                - name: normalized-at
                  value: "{{inputs.parameters.normalized-at}}"
                - name: validated-at
                  value: "{{inputs.parameters.validated-at}}"
                - name: activated-at
                  value: "{{inputs.parameters.activated-at}}"
          - name: marts
            template: marts
            dependencies: [replay]
            arguments:
              parameters:
                - name: source-release-id
                  value: "{{inputs.parameters.source-release-id}}"
                # replay는 discovery 없이 workflow uid 하나로 돌므로 run 정체성이 그것뿐이다.
                - name: detail-run-id
                  value: "{{workflow.uid}}"
                - name: publication-id
                  value: "{{inputs.parameters.publication-id}}"

    - name: discover
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-limit
      outputs:
        parameters:
          # CLI `--result-dir`가 machine result의 key마다 남긴 파일이다. 뒤 단계는 이 값만 받는다.
          - name: source-release-id
            valueFrom:
              path: /tmp/eatbid/source_release_id
          - name: detail-run-id
            valueFrom:
              path: /tmp/eatbid/detail_run_id
          - name: publication-id
            valueFrom:
              path: /tmp/eatbid/publication_id
          - name: external-bid-ids
            valueFrom:
              path: /tmp/eatbid/external_bid_ids
          - name: discovered-count
            valueFrom:
              path: /tmp/eatbid/discovered_count
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import os
            import sys
            import uuid

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                run_id = uuid.UUID(os.environ["EATBID_RUN_ID"])
            except (KeyError, ValueError):
                fail("EATBID_RUN_ID must be the workflow UUID")
            mode = os.environ.get("EATBID_WORKFLOW_MODE", "")
            created_at = os.environ.get("EATBID_WORKFLOW_CREATED_AT", "")
            result_dir = os.environ.get("EATBID_RESULT_DIR", "")
            if not mode or not created_at or not result_dir:
                fail("EATBID_WORKFLOW_MODE, EATBID_WORKFLOW_CREATED_AT, EATBID_RESULT_DIR are required")

            # 한 workflow의 release, detail run, publication 정체성은 workflow uid에서 결정적으로
            # 파생한다. 같은 pod가 다시 뜨면 새 정체성을 만들어 고아 run을 남기는 대신 같은 정체성으로
            # 충돌해 멈춘다. discovery run 자체는 workflow uid 그대로다.
            source_release_id = uuid.uuid5(run_id, "eatbid:source-release")
            detail_run_id = uuid.uuid5(run_id, "eatbid:detail-run")
            publication_id = uuid.uuid5(run_id, "eatbid:publication")
            release_name = os.environ.get("EATBID_RELEASE_NAME") or f"{mode} {created_at} {run_id}"

            os.makedirs(result_dir, exist_ok=True)
            with open(os.path.join(result_dir, "publication_id"), "w", encoding="utf-8") as handle:
                handle.write(str(publication_id))

            argv = [
                "eatbid", "discover",
                "--mode", mode,
                "--run-id", str(run_id),
                "--source-release-id", str(source_release_id),
                "--detail-run-id", str(detail_run_id),
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_PARSER_VERSION"],
                "--release-name", release_name,
                "--as-of", created_at,
                "--started-at", created_at,
                "--completed-at", created_at,
                "--start-date", os.environ.get("EATBID_START_DATE", ""),
                "--end-date", os.environ.get("EATBID_END_DATE", ""),
                "--result-dir", result_dir,
            ]
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - &env-run-id
            name: EATBID_RUN_ID
            value: "{{workflow.uid}}"
          - &env-parser-version
            name: EATBID_PARSER_VERSION
            value: "{{workflow.parameters.parser-version}}"
          - &env-created-at
            name: EATBID_WORKFLOW_CREATED_AT
            value: "{{workflow.creationTimestamp}}"
          - &env-result-dir
            name: EATBID_RESULT_DIR
            value: /tmp/eatbid
          - name: EATBID_START_DATE
            value: "{{workflow.parameters.start-date}}"
          - name: EATBID_END_DATE
            value: "{{workflow.parameters.end-date}}"
          - name: EATBID_RELEASE_NAME
            value: "{{workflow.parameters.release-name}}"
          - &env-database-url
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: eatbid-database-dataplane
                key: DATABASE_URL
          - &env-r2-endpoint
            name: R2_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_ENDPOINT_URL
          - &env-r2-bucket
            name: R2_BUCKET
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_BUCKET
          - &env-r2-access-key
            name: R2_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_ACCESS_KEY_ID
          - &env-r2-secret-key
            name: R2_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: eatbid-r2
                key: R2_SECRET_ACCESS_KEY

    - name: capture
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: external-bid-id
      synchronization:
        semaphores:
          - configMapKeyRef:
              name: eatbid-workflow-limits
              key: eatbid-source-limit
      outputs:
        parameters:
          - name: observation-id
            valueFrom:
              path: /tmp/eatbid/observation_id
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid capture --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --external-bid-id "$EATBID_EXTERNAL_BID_ID"
            --started-at "$EATBID_WORKFLOW_CREATED_AT"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - &env-source-release-id
            name: EATBID_SOURCE_RELEASE_ID
            value: "{{inputs.parameters.source-release-id}}"
          - &env-detail-run-id
            name: EATBID_DETAIL_RUN_ID
            value: "{{inputs.parameters.detail-run-id}}"
          - name: EATBID_EXTERNAL_BID_ID
            value: "{{inputs.parameters.external-bid-id}}"
          - *env-parser-version
          - *env-created-at
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: normalize
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: observation-id
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid normalize --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --observation-id "$EATBID_OBSERVATION_ID"
            --normalized-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - name: EATBID_OBSERVATION_ID
            value: "{{inputs.parameters.observation-id}}"
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: validate
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid validate --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --validated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - &env-publication-id
            name: EATBID_PUBLICATION_ID
            value: "{{inputs.parameters.publication-id}}"
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: project
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      synchronization:
        mutexes:
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - >-
            exec eatbid project --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --activated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - *env-publication-id
          - *env-parser-version
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: marts
      inputs:
        parameters:
          - name: source-release-id
          - name: detail-run-id
          - name: publication-id
      synchronization:
        mutexes:
          # core 발행과 다른 mutex를 쓴다. 같은 mutex면 mart 빌드가 다음 수집의 발행을 막아 소스
          # 관측이 늦어진다. mart는 파생물이라 stale이 정상 상태다(ADR 0011·0034).
          - name: eatbid-mart-build
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          # --mart를 주지 않는다. 어느 mart가 이 발행의 영향 범위인지는 CLI가 발행이 실은 record
          # type으로 고르며, 그 판단이 여기와 코드 두 곳에 살면 갈라진다.
          # --region-scheme도 주지 않는다. 지역 코드 체계의 권위는 code scheme 표 하나뿐이고
          # 체계를 바꾸는 것은 새 calc-version의 배포 결정이다(AGENTS 6).
          - >-
            exec eatbid build-marts --run-id "$EATBID_DETAIL_RUN_ID"
            --source-release-id "$EATBID_SOURCE_RELEASE_ID"
            --publication-id "$EATBID_PUBLICATION_ID"
            --calc-version "$EATBID_MART_CALC_VERSION"
            --as-of "$EATBID_WORKFLOW_CREATED_AT"
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --build-sha "$BUILD_SHA" --parser-version "$EATBID_PARSER_VERSION"
            --result-dir "$EATBID_RESULT_DIR"
        env:
          - name: EATBID_WORKFLOW_MODE
            value: "{{workflow.parameters.mode}}"
          - *env-source-release-id
          - *env-detail-run-id
          - *env-publication-id
          - name: EATBID_MART_CALC_VERSION
            value: "{{workflow.parameters.calc-version}}"
          - *env-parser-version
          - *env-created-at
          - *env-result-dir
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key

    - name: replay
      inputs:
        parameters:
          - name: source-release-id
          - name: publication-id
          - name: observation-ids-json
          - name: started-at
          - name: normalized-at
          - name: validated-at
          - name: activated-at
      synchronization:
        mutexes:
          - name: eatbid-core-publication
      container:
        image: eatbid-dataplane
        imagePullPolicy: IfNotPresent
        command: [python, -c]
        args:
          - |
            import json
            import os
            import sys

            def fail(message: str) -> None:
                print(message, file=sys.stderr)
                raise SystemExit(64)

            try:
                observation_ids = json.loads(os.environ["EATBID_OBSERVATION_IDS_JSON"])
            except (KeyError, json.JSONDecodeError):
                fail("observation-ids-json must be a JSON array")
            if not isinstance(observation_ids, list) or not observation_ids:
                fail("observation-ids-json must be a non-empty JSON array")
            if any(
                type(value) is not int
                or value <= 0
                or value > 9_223_372_036_854_775_807
                for value in observation_ids
            ):
                fail("every observation ID must be a positive bigint")
            if len(set(observation_ids)) != len(observation_ids):
                fail("observation IDs must be unique")

            argv = [
                "eatbid", "replay",
                "--run-id", os.environ["EATBID_RUN_ID"],
                "--source-release-id", os.environ["EATBID_SOURCE_RELEASE_ID"],
                "--build-sha", os.environ["BUILD_SHA"],
                "--parser-version", os.environ["EATBID_PARSER_VERSION"],
                "--publication-id", os.environ["EATBID_PUBLICATION_ID"],
            ]
            for observation_id in observation_ids:
                argv.extend(("--observation-id", str(observation_id)))
            argv.extend((
                "--started-at", os.environ["EATBID_STARTED_AT"],
                "--normalized-at", os.environ["EATBID_NORMALIZED_AT"],
                "--validated-at", os.environ["EATBID_VALIDATED_AT"],
                "--activated-at", os.environ["EATBID_ACTIVATED_AT"],
            ))
            os.execvp(argv[0], argv)
        env:
          - name: EATBID_WORKFLOW_MODE
            value: replay
          - *env-run-id
          - *env-parser-version
          - *env-source-release-id
          - *env-publication-id
          - name: EATBID_OBSERVATION_IDS_JSON
            value: "{{inputs.parameters.observation-ids-json}}"
          - name: EATBID_STARTED_AT
            value: "{{inputs.parameters.started-at}}"
          - name: EATBID_NORMALIZED_AT
            value: "{{inputs.parameters.normalized-at}}"
          - name: EATBID_VALIDATED_AT
            value: "{{inputs.parameters.validated-at}}"
          - name: EATBID_ACTIVATED_AT
            value: "{{inputs.parameters.activated-at}}"
          - *env-database-url
          - *env-r2-endpoint
          - *env-r2-bucket
          - *env-r2-access-key
          - *env-r2-secret-key
