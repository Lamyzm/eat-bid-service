apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-db-backup
  namespace: eatbid
spec:
  schedules:
    # 매시 5분. 정각은 poll-open(30분 주기)과 겹치므로 5분 비켜 둔다. 손실 허용치(RPO)는 1시간이며
    # 그 사이 관측은 R2 raw와 daily-reconcile이 소스에서 다시 받는다(EAT-127, runtime §9).
    - "5 * * * *"
  timezone: Asia/Seoul
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  workflowSpec:
    serviceAccountName: eatbid-dataplane
    entrypoint: backup
    podGC:
      strategy: OnPodSuccess
    ttlStrategy:
      secondsAfterSuccess: 3600
      secondsAfterFailure: 86400
    templates:
      # pg_dump와 R2 업로드는 서로 다른 이미지가 필요하므로 한 파드 안의 두 컨테이너가 emptyDir을 공유한다.
      # 두 파드로 나누면 덤프를 artifact로 옮겨야 하고 artifact repository가 없다.
      - name: backup
        volumes:
          - name: work
            emptyDir: {}
        containerSet:
          volumeMounts:
            - name: work
              mountPath: /work
          containers:
            - name: dump
              # postgres Deployment와 같은 major. custom format이라 부분 복원(schema 선택)이 가능하다(EAT-130 dev 첫 채움).
              #
              # database 소유자 자격을 쓴다. migrator는 app·core·ingest·mart만 소유하고 레거시 `public`
              # 18개 표(2.9GB, firm_bids·school_roster 등)는 소유자가 `eatbid`라 LOCK TABLE에서 거부된다
              # (2026-09-10 첫 스케줄 실행이 `permission denied for table account`로 실패, EAT-127).
              # 재해 복구는 database 전체가 대상이므로 읽는 범위를 좁히는 대신 소유자로 읽는다.
              # 덜 강한 전용 백업 역할은 Drizzle이 role을 만들어야 해 후속으로 둔다.
              image: postgres:16-alpine
              command: [sh, -c]
              args:
                - |
                  set -eu
                  pg_dump --format=custom --no-owner --no-privileges --file=/work/eatbid.dump
                  ls -l /work/eatbid.dump
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-postgres-bootstrap
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-postgres-bootstrap
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-postgres-bootstrap
                      key: POSTGRES_DB
              resources:
                requests:
                  memory: 256Mi
                limits:
                  memory: 1Gi
            - name: upload
              image: rclone/rclone:1.68
              dependencies:
                - dump
              command: [sh, -c]
              args:
                - |
                  set -eu
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  hourly="r2:${R2_BUCKET}/backup/postgres/hourly/${stamp}.dump"
                  rclone copyto /work/eatbid.dump "$hourly" --s3-no-check-bucket
                  # 하루 한 번(KST 03시 회차)은 30일 보존 폴더에도 둔다. 시각 판정은 KST 기준이며 컨테이너는 UTC다.
                  if [ "$(TZ=Asia/Seoul date +%H)" = "03" ]; then
                    rclone copyto /work/eatbid.dump "r2:${R2_BUCKET}/backup/postgres/daily/${stamp}.dump" --s3-no-check-bucket
                  fi
                  rclone delete "r2:${R2_BUCKET}/backup/postgres/hourly" --min-age 168h
                  rclone delete "r2:${R2_BUCKET}/backup/postgres/daily" --min-age 720h
                  rclone lsl "r2:${R2_BUCKET}/backup/postgres/hourly" | tail -n 3
              env:
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-r2
                      key: R2_ENDPOINT_URL
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-r2
                      key: R2_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-r2
                      key: R2_SECRET_ACCESS_KEY
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: eatbid-r2
                      key: R2_BUCKET
              resources:
                requests:
                  memory: 128Mi
                limits:
                  memory: 512Mi
