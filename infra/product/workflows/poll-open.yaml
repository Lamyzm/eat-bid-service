apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-poll-open
  namespace: eatbid
spec:
  schedules:
    # 평일 08:00~19:50 KST 10분(2026-09-10, EAT-151). 신규 공고 노출 SLO 15분 = 주기 10 + 회차 실행 최대 5이며
    # 근거와 5분으로 더 올릴 조건은 runtime 문서 §2.5다. 상세는 신규·변경 공고만 부르므로(ADR 0037) 주기를
    # 올려 늘어나는 소스 호출은 회차당 목록 page 몇 장뿐이다.
    - "*/10 8-19 * * 1-5"
  timezone: Asia/Seoul
  # 2026-09-05 수집 cutover(EAT-51). 항상 켜진 VM 클러스터(EAT-50)로 옮긴 뒤에야 suspend를 풀었다 —
  # Docker Desktop 시절에는 재부팅마다 스케줄이 끊겨 수집을 켜는 것이 의미가 없었다. 수집을 멈춰야 하면
  # 여기서 suspend: true로 되돌리고 그 이유를 커밋 메시지에 남긴다. 다른 곳에서 CronWorkflow를 만들지 않는다(AGENTS 9).
  suspend: false
  concurrencyPolicy: Forbid
  # 주기와 같은 600초다. 실행이 10분을 넘기면 그 사이 tick은 Forbid로 만들어지지 않고, 끝난 뒤 마지막으로 놓친
  # tick 하나만 이 창 안이라 늦게 만들어진다(Argo v4.0.8 shouldOutstandingWorkflowsBeRun). 회차는 겹치지 않는다.
  startingDeadlineSeconds: 600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    # 신규 공고 노출 SLO의 보장은 이 priority가 아니라 source semaphore key 분리다 — 스케줄 수집은
    # eatbid-source-live, backfill은 eatbid-source-backfill을 잡아 아예 같은 대기열에 서지 않는다
    # (semaphore.yaml, workflow-template.yaml의 backfill-pipeline, 2026-09-11 EAT-164). 이전에는 이
    # priority 하나로 backfill보다 앞서게 했지만(EAT-93), 2026-09-10 18:53 회차가 이 값을 가진 채로도
    # discover 이후 상세 수집 10묶음 중 8개가 backfill chunk(기본 priority 0) 뒤에서 2시간 대기하다 끝나
    # "priority 내림차순 큐"(Argo v4.0.8 sync manager) 가정이 실제로는 지켜지지 않음을 보였다 — 그
    # 원인 규명은 이 변경의 범위가 아니다. 값은 남긴다: 같은 eatbid-source-live를 다투는 poll-open·
    # daily-reconcile 사이 순서와 컨트롤러 큐 일반의 의미는 여전히 priority가 쥔다.
    priority: 100
    arguments:
      parameters:
        - name: mode
          value: poll-open
