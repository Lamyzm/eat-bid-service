apiVersion: v1
kind: ConfigMap
metadata:
  name: eatbid-workflow-limits
  namespace: eatbid
data:
  # 클러스터가 밖으로 내는 동시 source 호출 상한을 한 곳에서 본다는 의도는 그대로다. 새로 시작하는
  # 실행 기준 합은 2다(2026-09-11, EAT-164). 상한 1을 유지하면 poll-open·daily-reconcile·기준정보
  # 수집이 대기 중인 backfill chunk 수백 개 뒤에 줄을 서 신규 공고 노출 SLO 15분(EAT-151)이 깨진다 —
  # 2026-09-10 18:53 회차는 discover까지만 마치고 상세 수집 10묶음 중 1개만 끝낸 채 2시간 만에
  # 끝났다. 그렇다고 상한만 2로 올리면 대기열에 수백 묶음이 쌓인 backfill이 두 자리를 다 가져가므로
  # key를 나눈다.
  #
  # eatbid-source-live: 스케줄 수집(discover·capture)과 기준정보 수집(capture-reference)이 쓴다.
  # 기준정보는 월 1회·짧게 끝나는 실행이라 backfill 쪽에 두면 backfill이 며칠 도는 동안 밀린다.
  # eatbid-source-backfill: 이 배포 이후 새로 제출하는 backfill 전용 discover-backfill·
  # capture-backfill이 쓴다(workflow-template.yaml `backfill-pipeline`). replay는 기존 raw를
  # 재해석만 하고 소스를 다시 부르지 않아 둘 다 잡지 않는다.
  #
  # eatbid-source-limit: 과도기 key다 — 지우지 마라. 이 배포 시점에 이미 돌고 있던 backfill
  # Workflow가 workflowTemplateRef 스냅샷에 이 key를 들고 있다. Argo는 실행 중 Workflow의 template을
  # 다시 읽지 않지만 semaphore capacity는 chunk를 새로 잡을 때마다 이 ConfigMap을 live로 읽는다
  # (2026-09-11 운영에서 `status.synchronization.holding`으로 확인). 지금 지우면 그 실행이 다음
  # chunk를 잡으려는 순간의 동작이 검증되지 않고, 복구 수단인 fail-release CLI는 아직 없다(EAT-122).
  # capacity는 예전과 같은 1을 유지한다 — 늘리거나 줄이면 그 실행이 예상 밖의 동시성을 본다.
  # 총합이 3으로 보이지만 새로 시작하는 실행 기준 실제 동시 사용은 2다: backfill은 한 번에 하나만
  # 돌고 도는 backfill이 끝나기 전에 새 backfill을 띄우지 않는다는 운영 규율을 전제한다 — 이 규율은
  # manifest가 강제하지 않고 운영이 지킨다. 제거 조건: 이 배포 시점에 돌던 backfill Workflow가 끝나고
  # 클러스터에 eatbid-source-limit을 쓰는 실행이 하나도 없을 때.
  # `infra/tests/test_workflow_contract.py`의
  # `test_eatbid_source_limit는_과도기_key이고_도는_backfill이_끝나면_지운다`가 이 key를 단언하는
  # 동안은 아직 지우면 안 된다는 신호다. 후속 정리는 별도 이슈로 추적한다.
  # backfill capacity를 8로 올린다(2026-09-14, EAT-180). semaphore는 chunk pod 단위로 잡히고 pod
  # 하나가 50건을 순차로 부르므로, capacity가 곧 소스 동시 호출 수다 — 8이면 정확히 8이다. 코드의
  # 건별 루프를 병렬화하지 않고 이 숫자로 같은 배수를 얻는다.
  #
  # 4를 거치지 않고 8로 가는 이유는 직렬이 근거 없이 느리기 때문이다. 한 창 7.2시간은 건당 1.53초인데
  # 그 대부분이 대기다. 노드는 CPU 1%였고 이 저장소가 소스를 부른 이래 SOURCE_THROTTLED가 0건이다.
  # 상한이 어디인지 모르는 채로 1에 머무는 것이 가장 비싼 선택이다. 8도 소스 입장에서 큰 수가 아니고,
  # 되돌리기가 이 줄 하나라 잘못 골랐을 때의 비용이 작다.
  #
  # 왜 지금 올리나. 2025-11 한 창이 7.2시간이고 5년이면 60창이라 직렬로는 약 360시간이다. 병목은
  # 계산이 아니라 대기다 — 노드는 CPU 1%였고 건당 약 1.6초가 소스 왕복이다. 그리고 지금까지
  # SOURCE_THROTTLED가 0건이라 여유가 얼마인지 한 번도 재지 않았다.
  #
  # 중단 조건: 429·403이 하나라도 나오면 이 값을 1로 되돌린다. 응답 p95가 직전 단계의 두 배를 넘으면
  # 멈춘다. 되돌리기는 이 줄 하나이며 Argo가 capacity를 chunk마다 live로 읽으므로 즉시 듣는다.
  # 다음 단계는 8이며 4가 한 창을 끝까지 성공시킨 실측을 evidence에 남긴 뒤에 올린다.
  #
  # live는 1을 유지한다. 사용자가 보는 신규 공고 노출 SLO가 거기 걸려 있고, 그 lane은 대기열이 길지
  # 않아 동시성을 올릴 이유가 없다.
  eatbid-source-live: "1"
  eatbid-source-backfill: "8"
  eatbid-source-limit: "1"
