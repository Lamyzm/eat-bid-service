apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-daily-reconcile
  namespace: eatbid
spec:
  schedules:
    - "0 7 * * *"
  timezone: Asia/Seoul
  # 2026-09-05 수집 cutover(EAT-51). poll-open과 같은 이유로 항상 켜진 클러스터에서만 suspend를 푼다.
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    # 스케줄 수집은 backfill(기본 priority 0)보다 먼저 source semaphore를 받는다. poll-open과 같은 값이며
    # 근거는 그쪽 주석(EAT-93)이다.
    priority: 100
    arguments:
      parameters:
        - name: mode
          value: daily-reconcile
