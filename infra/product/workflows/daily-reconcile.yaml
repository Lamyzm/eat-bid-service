apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: eatbid-daily-reconcile
  namespace: eatbid
spec:
  schedules:
    - "0 7 * * *"
  timezone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  workflowSpec:
    workflowTemplateRef:
      name: eatbid-dataplane
    arguments:
      parameters:
        - name: mode
          value: daily-reconcile
