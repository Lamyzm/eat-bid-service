# 푸시 → 테스트 → 이미지 빌드·푸시 → 매니페스트 태그 갱신 → ArgoCD 가 배포.
#
# 사람이 손으로 하는 단계가 0 이어야 한다. 하나라도 남으면 그게 새 기계에서
# 빠질 단계다. 설계 근거: docs/ARCH-DELIVERY.md §3·§4.
#
# 검증 기준(이게 통과해야 이 파일이 제 일을 한 것이다):
#   git push → 파드 교체 → kubectl -n eatbid exec deploy/web -- printenv BUILD_SHA
#   가 방금 푸시한 짧은 SHA 와 같다.
#
# ⚠ dataplane 은 여기서 안 빌드한다. 그 소스는 다른 리포(eat-bid)에 있다.
#   그 리포의 CI 가 이 리포의 kustomization 을 고치려면 교차 리포 쓰기가 되고,
#   GITHUB_TOKEN 은 자기 리포에만 쓰기 권한이 있어서 PAT 이 하나 더 필요해진다.
#   그게 리포를 안 합쳤을 때 드는 비용이다 — ARCH-DELIVERY §2.

name: build

on:
  push:
    branches: [master]
    paths-ignore:
      # 🔴 이 필터가 없으면 아래 bump 잡의 커밋이 이 워크플로를 다시 켜고,
      #   그게 또 커밋을 만들어 무한 루프가 된다. 1차 방어는 여기다
      #   (커밋 메시지의 [skip ci] 는 보조 수단이다).
      - 'infra/k8s/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# 같은 브랜치의 이전 실행을 취소한다. 두 실행이 동시에 태그를 커밋하면
# 나중 것이 앞의 것을 덮어 어느 SHA 가 배포됐는지 알 수 없게 된다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/lamyzm

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: pnpm/action-setup@v4
        with: { version: '10.12.1' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: pnpm install --frozen-lockfile
      # 훅과 같은 명령을 부른다. 정의는 package.json 한 곳에 있고 훅도 CI 도
      # 호출만 한다 — 같은 테스트를 두 곳에 적으면 그 둘이 갈린다.
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            dockerfile: Dockerfile.web
          - app: server
            dockerfile: Dockerfile.server
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          # 불변 태그가 본체다. :latest 는 사람이 눈으로 볼 때만 쓴다 —
          # 매니페스트는 절대 :latest 를 가리키지 않는다.
          tags: |
            ${{ env.REGISTRY }}/eatbid-${{ matrix.app }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/eatbid-${{ matrix.app }}:latest
          # 이 값이 이미지 안 BUILD_SHA 가 되고, 배포 후 대조하는 그 스탬프다.
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          # bump 커밋을 밀어야 하므로 기본 토큰의 쓰기 권한을 쓴다.
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # kustomize 바이너리를 설치하지 않는다 — 러너 기본이 아니라서 외부
      # 릴리스에 매번 의존하게 된다. 이 스크립트는 로컬에서도 그대로 돈다.
      - run: python3 infra/bump-image.py --sha "${{ steps.sha.outputs.short }}" eatbid-web eatbid-server

      - name: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- infra/k8s/base/kustomization.yaml; then
            echo "태그가 이미 ${{ steps.sha.outputs.short }} 다 — 커밋 없음"
            exit 0
          fi
          git add infra/k8s/base/kustomization.yaml
          git commit -m "배포 태그 ${{ steps.sha.outputs.short }} [skip ci]"
          git push
          echo "ArgoCD 가 이 커밋을 보고 배포한다"
