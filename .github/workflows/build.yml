name: build

on:
  push:
    branches: [master]
    paths-ignore:
      # The promotion commit changes only the digest set and must not rebuild itself.
      - infra/product/kustomization.yaml
      - docs/**
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/lamyzm

jobs:
  test:
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/master' &&
        github.repository == 'Lamyzm/eat-bid-service' &&
        github.server_url == 'https://github.com' &&
        github.sha == github.workflow_sha &&
        github.workflow_ref == format(
          '{0}/.github/workflows/build.yml@{1}', github.repository, github.ref
        )
      }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eatbid
          POSTGRES_PASSWORD: eatbid
          POSTGRES_DB: eatbid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eatbid -d eatbid_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://eatbid:eatbid@127.0.0.1:5432/eatbid_ci
    steps:
      - uses: actions/checkout@v4
        # 레거시 inventory 회귀 테스트는 폐기 근거가 된 고정 커밋을 읽으므로 shallow clone으로는 재현할 수 없다.
        with:
          fetch-depth: 0
      - id: provenance-preflight
        name: Reject unsupported publication workflow context
        env:
          EATBID_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: python3 infra/generate_slsa_provenance.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true

      - name: Install TypeScript workspace from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install dataplane from lockfile
        working-directory: apps/dataplane
        run: uv sync --frozen
      - name: Verify backend strict-peer closure and immutable lockfile
        run: |
          pnpm install --filter @eatbid/server... --frozen-lockfile --strict-peer-dependencies
          pnpm install --filter @eatbid/server... --lockfile-only --frozen-lockfile --strict-peer-dependencies
      - name: Check architecture and generated contract drift
        run: pnpm architecture:check
      - name: Test TypeScript workspace
        run: pnpm test
      - name: Build TypeScript workspace
        run: pnpm build
      - name: Test dataplane
        working-directory: apps/dataplane
        run: uv run pytest -q
      - name: Lint dataplane
        working-directory: apps/dataplane
        run: uv run ruff check src tests
      - name: Type-check dataplane
        working-directory: apps/dataplane
        run: uv run pyright src
      - name: Test delivery contracts
        run: uv run --project apps/dataplane pytest infra/tests -q
      - name: Lint delivery code
        run: >-
          uv run --project apps/dataplane ruff check
          infra/update_image_digest.py infra/generate_slsa_provenance.py
          infra/verify_argo_platform.py infra/tests
      - id: verify-argo-delivery
        name: Render exact Argo chart and strictly lint product workflows
        run: |
          set -euo pipefail
          verification_dir="$RUNNER_TEMP/eatbid-argo-verification"
          mkdir -p "$verification_dir"
          uv run --project apps/dataplane python infra/verify_argo_platform.py \
            values infra/platform/argo-workflows.application.yaml \
            > "$verification_dir/values.yaml"
          docker run --rm \
            --volume "$verification_dir:/verification:ro" \
            alpine/helm@sha256:a572075a78666ad6fb1f40cb477a9e2eabbc46f3739beeb81904a6121f6ef027 \
            template eatbid-argo-workflows argo-workflows \
            --repo https://argoproj.github.io/argo-helm \
            --version 1.0.23 --namespace eatbid \
            --values /verification/values.yaml > "$verification_dir/chart.yaml"
          uv run --project apps/dataplane python infra/verify_argo_platform.py \
            verify "$verification_dir/chart.yaml" --namespace eatbid
          docker run --rm \
            --volume "$verification_dir:/verification:ro" \
            --volume "$PWD:/workspace:ro" \
            alpine/helm@sha256:a572075a78666ad6fb1f40cb477a9e2eabbc46f3739beeb81904a6121f6ef027 \
            template eatbid-argo-workflows argo-workflows \
            --repo https://argoproj.github.io/argo-helm \
            --version 1.0.23 --namespace eatbid \
            --values /verification/values.yaml \
            --values /workspace/infra/tests/fixtures/argo-workflows-extra-list.values.yaml \
            > "$verification_dir/adversarial-chart.yaml"
          if uv run --project apps/dataplane python infra/verify_argo_platform.py \
            verify "$verification_dir/adversarial-chart.yaml" --namespace eatbid \
            2> "$verification_dir/adversarial-error.txt"; then
            echo "Verifier accepted Helm extraObjects List wrapper" >&2
            exit 1
          fi
          grep -F "List-like Kubernetes documents are forbidden" \
            "$verification_dir/adversarial-error.txt"
          kubectl kustomize infra/product > "$verification_dir/product.yaml"
          uv run --project apps/dataplane python infra/verify_argo_platform.py \
            filter-workflows \
            --input "$verification_dir/product.yaml" \
            > "$verification_dir/product-workflows.yaml"
          docker run --rm \
            --volume "$verification_dir:/verification:ro" \
            quay.io/argoproj/argocli@sha256:83e93aa9149a51da998c1df4abea7ae2c504e0b0a5892052dc092740f68323e8 \
            lint --offline --strict /verification/product-workflows.yaml

      - name: Check generated migrations are committed and stable
        run: |
          set -euo pipefail
          pnpm db:check
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle packages/db/src/schema
          test -z "$(git status --porcelain --untracked-files=all -- packages/db/drizzle packages/db/src/schema)"
      - name: Migrate an empty PostgreSQL and prove the rerun is a no-op
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:migrate

  contract-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      - name: Install TypeScript workspace from lockfile
        run: pnpm install --frozen-lockfile
      - name: Install dataplane from lockfile
        working-directory: apps/dataplane
        run: uv sync --frozen
      - name: Check architecture and generated contract drift on Windows
        run: pnpm architecture:check
      - name: Test semantic mutation gates on Windows
        run: pnpm test:quality

  build:
    needs: [test, contract-portability]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            context: .
            dockerfile: ./Dockerfile.web
          - app: server
            context: .
            dockerfile: ./Dockerfile.server
          - app: dataplane
            context: ./apps/dataplane
            dockerfile: ./apps/dataplane/Dockerfile
          - app: migration
            context: .
            dockerfile: ./packages/db/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: generate-provenance
        name: Generate deterministic SLSA v1 provenance predicate
        env:
          EATBID_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: >-
          python3 infra/generate_slsa_provenance.py
          --output "provenance-${{ matrix.app }}.json"
      - uses: docker/setup-buildx-action@v3
      - id: build-local
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/eatbid-${{ matrix.app }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - id: scan
        name: Reject HIGH or CRITICAL vulnerabilities in the local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/eatbid-${{ matrix.app }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.73.0
      - id: sbom
        name: Generate SPDX SBOM from the same local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/eatbid-${{ matrix.app }}:${{ github.sha }}
          format: spdx-json
          output: sbom-${{ matrix.app }}.spdx.json
          exit-code: "0"
          skip-setup-trivy: true
          version: v0.73.0

      - id: registry-login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Push the exact scanned tag and resolve its registry digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/eatbid-${{ matrix.app }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          manifest_json="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}')"
          digest="$(jq -er '.digest' <<<"$manifest_json")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid registry digest: $digest" >&2
            exit 2
          fi
          echo "name=${IMAGE_REF%:*}" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - id: setup-cosign
        name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - id: sign
        name: Keyless-sign the exact registry digest
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE_NAME@$IMAGE_DIGEST"
      - id: attest-provenance
        name: Attach SLSA provenance to the exact registry digest
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          cosign attest --yes --type slsaprovenance1
          --predicate "provenance-${{ matrix.app }}.json"
          "$IMAGE_NAME@$IMAGE_DIGEST"
      - id: attest-sbom
        name: Attach the scanned SPDX SBOM to the exact registry digest
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          cosign attest --yes --type spdxjson
          --predicate "sbom-${{ matrix.app }}.spdx.json"
          "$IMAGE_NAME@$IMAGE_DIGEST"
      - id: verify-signature
        name: Verify issuer and exact workflow identity on the signature
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/master"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$IDENTITY" \
            "$IMAGE_NAME@$IMAGE_DIGEST"
      - id: verify-provenance
        name: Verify issuer and exact workflow identity on the SLSA attestation
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/master"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$IDENTITY" \
            "$IMAGE_NAME@$IMAGE_DIGEST"
      - id: verify-sbom
        name: Verify issuer and exact workflow identity on the SPDX attestation
        env:
          IMAGE_NAME: ${{ steps.publish.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/master"
          cosign verify-attestation --type spdxjson \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "$IDENTITY" \
            "$IMAGE_NAME@$IMAGE_DIGEST"

      - id: record
        name: Record the verified immutable image digest
        run: |
          set -euo pipefail
          digest='${{ steps.publish.outputs.digest }}'
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid verified digest: $digest" >&2
            exit 2
          fi
          mkdir -p digests
          printf '%s' "$digest" > "digests/${{ matrix.app }}"
      - id: upload-digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.app }}
          path: digests/${{ matrix.app }}
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to promote onto a different commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - id: validate-and-pin
        name: Validate every matrix digest and pin manifest consumers
        run: |
          set -euo pipefail
          for app in web server dataplane migration; do
            digest="$(tr -d '\r\n' < "digests/$app")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid $app digest: $digest" >&2
              exit 2
            fi
          done
          python3 infra/update_image_digest.py --file infra/product/kustomization.yaml eatbid-web "$(cat digests/web)"
          python3 infra/update_image_digest.py --file infra/product/kustomization.yaml eatbid-server "$(cat digests/server)"
          python3 infra/update_image_digest.py --file infra/product/kustomization.yaml eatbid-dataplane "$(cat digests/dataplane)"
          python3 infra/update_image_digest.py --file infra/product/kustomization.yaml eatbid-migration "$(cat digests/migration)"
      - name: Commit product digest set
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- infra/product/kustomization.yaml; then
            echo "Product digests already match this build"
            exit 0
          fi
          git add infra/product/kustomization.yaml
          git commit -m "deploy: 제품 이미지 digest를 ${GITHUB_SHA}로 고정한다 [skip ci]"
          git push
